/* T995 營運管理：延遲訂單、月度餐廳回覆連結與劃線／簽名。 */
/* 營運管理共用介面。分頁與登記邏輯位於 operations-entry.js。 */
const opsToday=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
function opsEscape(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const opsSetToggle=(id,on)=>{const b=$(id);b.classList.toggle("selected",on);b.setAttribute("aria-pressed",String(on));};

/* 每日成績報表：辨識 ByDate／ByOrder，排除不必要個資欄位後寫入歷史資料表。 */
const opsScoreFileInput=$("opsScoreFiles");
let opsPreparedScoreFiles=[];
const opsByDateColumns=["訂單號碼","ID（門市名稱／代號）","訂單日期","指派時間","QT","留店時間","外送時間（去）","外送達成時間（D30)","外出時間 (車程)","完成整張外送時間","距離"];
const opsByOrderColumns=["reg order id","RC","AC","ID","訂單","自動/手動","落單時間","預計送達時間","原預計送達時間","指派時間","門市到達時間","外送出發","到達時間","到店時間","外送員留店時間","遲到時間","Quote Time","配送費","餐點金額","結算金額","距離","D7","D25"];
function opsXlsxValue(value){
  if(value instanceof Date){const d=new Date(value.getTime()-value.getTimezoneOffset()*60000);return d.toISOString().slice(0,19).replace("T"," ");}
  return value;
}
function opsDateIso(value){
  if(value instanceof Date&&!Number.isNaN(value.getTime())){const d=new Date(value.getTime()-value.getTimezoneOffset()*60000);return d.toISOString().slice(0,10);}
  if(typeof value==="number"&&window.XLSX?.SSF?.parse_date_code){const d=XLSX.SSF.parse_date_code(value);if(d?.y&&d?.m&&d?.d)return String(d.y).padStart(4,"0")+"-"+String(d.m).padStart(2,"0")+"-"+String(d.d).padStart(2,"0");}
  const text=String(value??"").trim();let m=text.match(/^(20\d{2})[./-](\d{1,2})[./-](\d{1,2})/);
  if(m)return opsValidIsoDate(Number(m[1]),Number(m[2]),Number(m[3]));
  m=text.match(/^(\d{1,2})[./-](\d{1,2})[./-](20\d{2})/);
  if(m)return opsValidIsoDate(Number(m[3]),Number(m[1]),Number(m[2]));
  return "";
}
function opsValidIsoDate(y,m,d){const value=new Date(Date.UTC(y,m-1,d));return value.getUTCFullYear()===y&&value.getUTCMonth()===m-1&&value.getUTCDate()===d?String(y).padStart(4,"0")+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"):"";}
function opsScorePair(){
  if(opsPreparedScoreFiles.length!==2)return null;
  const byType=Object.fromEntries(opsPreparedScoreFiles.map(x=>[x.type,x]));if(!byType.ByDate||!byType.ByOrder)return null;
  const a=byType.ByDate.dates,b=byType.ByOrder.dates;if(a.length!==b.length||a.some((d,i)=>d!==b[i]))return null;
  return {byType,dates:a};
}
async function opsParseScoreFile(file){
  if(!window.XLSX)throw new Error("Excel 元件尚未載入，請重新整理後再試。");
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
  const sheetName=wb.SheetNames[0];if(!sheetName)throw new Error("檔案沒有工作表。");
  const matrix=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:"",raw:true});
  if(!matrix.length)throw new Error("工作表沒有資料。");
  const headers=matrix[0].map(v=>String(v??"").trim());
  const lower=headers.map(v=>v.toLowerCase());
  let type="";
  if(headers.includes("訂單號碼")&&headers.some(v=>v.includes("門市名稱／代號"))&&headers.includes("QT"))type="ByDate";
  else if(lower.includes("reg order id")&&headers.includes("落單時間")&&headers.includes("D25"))type="ByOrder";
  else throw new Error("無法辨識報表格式；請選 ByDate 或 ByOrder Excel 檔。");
  const allowed=type==="ByDate"?opsByDateColumns:opsByOrderColumns;
  const indices=allowed.map(name=>headers.indexOf(name));
  const orderHeader=type==="ByDate"?"訂單號碼":"reg order id";
  const dateHeader=type==="ByDate"?"訂單日期":"落單時間";
  const restaurantHeader=type==="ByDate"?"ID（門市名稱／代號）":"ID";
  const fileDates=[...new Set([...String(file.name).matchAll(/20\d{2}[.-]\d{2}[.-]\d{2}/g)].map(x=>x[0]))],fileDate=fileDates.length===1?opsDateIso(fileDates[0]):"";
  const rows=[];
  matrix.slice(1).forEach((cells,index)=>{
    if(!cells.some(v=>v!==""&&v!==null&&v!==undefined))return;
    const payload={};
    indices.forEach((column,i)=>{if(column<0)return;const value=cells[column];if(value===""||value===null||value===undefined)return;payload[allowed[i]]=opsXlsxValue(value);});
    const orderNo=String(payload[orderHeader]??"").trim();
    const restaurantRaw=String(payload[restaurantHeader]??"").trim();
    const codeMatch=(type==="ByDate"?restaurantRaw:orderNo).match(/(?:TWI|TWB)(\d{3})/i);
    const storeCode=codeMatch?codeMatch[1]:"";
    const restaurantName=type==="ByDate"?restaurantRaw.split(/[/／]/)[0].trim():restaurantRaw;
    const dateValue=cells[headers.indexOf(dateHeader)],dateText=opsDateIso(dateValue)||fileDate;
    rows.push({row_number:index+2,record_date:dateText,store_code:storeCode,restaurant_name:restaurantName,order_number:orderNo,payload});
  });
  if(!rows.length)throw new Error("報表沒有可匯入的訂單資料列。");
  if(rows.some(r=>!r.record_date))throw new Error("有訂單列沒有可辨識的日期；請使用含日期欄的報表。");
  const dates=[...new Set(rows.map(r=>r.record_date))].sort();
  return {file,type,dates,rows};
}
function opsRenderPreparedScoreFiles(errors=[]){
  const data=opsPreparedScoreFiles.map(x=>({file:x.file.name,type:x.type,date:x.dates.length===1?x.dates[0]:x.dates[0]+"～"+x.dates.at(-1)+"（"+x.dates.length+"天）",count:x.rows.length,status:"待匯入"}));
  const failed=errors.map(x=>({file:x.file,type:"—",date:"—",count:"—",status:x.error}));
  const all=[...data,...failed];
  $("opsScorePreview").innerHTML=all.length
    ?'<table class="ops-table"><thead><tr><th>檔案</th><th>報表類型</th><th>日期</th><th>資料筆數</th><th>狀態</th></tr></thead><tbody>'+all.map(x=>'<tr><td>'+opsEscape(x.file)+'</td><td>'+opsEscape(x.type)+'</td><td>'+opsEscape(x.date)+'</td><td>'+opsEscape(x.count)+'</td><td>'+opsEscape(x.status)+'</td></tr>').join("")+'</tbody></table>'
    :"";
  $("opsScoreImport").disabled=!opsScorePair();
}
opsScoreFileInput.addEventListener("change",async()=>{
  opsPreparedScoreFiles=[];$("opsScoreImport").disabled=true;$("opsScoreMessage").textContent="讀取與辨識檔案中…";
  const errors=[];
  for(const file of [...(opsScoreFileInput.files||[])]){
    try{opsPreparedScoreFiles.push(await opsParseScoreFile(file));}
    catch(e){errors.push({file:file.name,error:e.message||"檔案無法讀取"});}
  }
  opsRenderPreparedScoreFiles(errors);
  const pair=opsScorePair();$("opsScoreMessage").textContent=errors.length?"辨識完成；"+errors.length+" 個檔案格式不符或無法讀取。":pair?"兩份檔案日期一致，共 "+pair.dates.length+" 天，可匯入。":"請選擇一份 ByDate 與一份 ByOrder 檔案，且兩份檔案的日期範圍需一致。";
});
$("opsScoreImport").onclick=async()=>{
  const pair=opsScorePair();if(!pair){$("opsScoreMessage").textContent="請選擇一份 ByDate 與一份 ByOrder 檔案，且兩份檔案的日期範圍需一致。";return;}
  $("opsScoreImport").disabled=true;$("opsScoreMessage").textContent="匯入資料中…";
  const importedDate=pair.dates.at(-1);let completed=0;
  try{
    for(let i=0;i<pair.dates.length;i+=4){
      const dates=pair.dates.slice(i,i+4),results=await Promise.all(dates.flatMap(date=>Object.values(pair.byType).map(item=>db.rpc("t995_import_score_batch",{p_report_date:date,p_report_type:item.type,p_source_file:item.file.name,p_rows:item.rows.filter(row=>row.record_date===date)}))));
      completed+=results.filter(r=>!r.error).length;if(results.some(r=>r.error))throw new Error("已完成 "+Math.floor(completed/2)+"／"+pair.dates.length+" 天；"+results.find(r=>r.error).error.message);
      $("opsScoreMessage").textContent="匯入中… "+Math.floor(completed/2)+"／"+pair.dates.length+" 天";
    }
    $("opsScoreMessage").textContent="完成匯入 "+pair.dates.length+" 天（兩種報表已分別按日整理）。";
    opsPreparedScoreFiles=[];opsScoreFileInput.value="";opsRenderPreparedScoreFiles();
    $("opsAnalysisDate").value=importedDate||opsToday();
    await opsLoadDailyAnalytics();
  }catch(e){$("opsScoreMessage").textContent="匯入中止："+(e.message||"請檢查資料庫 migration 與登入狀態");}
  finally{$("opsScoreImport").disabled=!opsScorePair();}
};
