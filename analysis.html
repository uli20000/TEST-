<style>

<body>
<header><div class="topline"><div class="brand">KFC DELIVERY CENTER｜T995</div><a class="back" href="admin.html">返回後台</a></div><h1>營運分析儀表板</h1><div class="subtitle">日報・週報・月報｜餐廳成績與等餐原因</div></header>

</div></div>
</main></div>
<script>
const SUPABASE_URL="https://nurnboqwhctyswcufkyk.supabase.co";
const SUPABASE_KEY="sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const shiftDate=(s,n)=>{const d=new Date(s+"T12:00:00+08:00");d.setDate(d.getDate()+n);return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);};
const regionFor=name=>{const n=String(name||"");if(n.includes("大園"))return "G 大園";if(n.includes("大竹"))return "J 大竹";if(n.includes("大溪")||n.includes("龍潭"))return "H 大溪龍潭";if(n.includes("林口"))return "I 林口";if(n.includes("竹北")||n.includes("自強")||n.includes("中華"))return "B 竹北";if(n.includes("竹東"))return "C 竹東";if(n.includes("苗栗")||n.includes("頭份")||n.includes("竹南"))return "K 苗栗";if(n.includes("楊梅"))return "F 楊梅";if(n.includes("中壢")||n.includes("過嶺")||n.includes("領航"))return "D 中壢";if(n.includes("桃園")||n.includes("南崁"))return "E 桃園";if(n.includes("新竹")||n.includes("湖口")||n.includes("新豐"))return "A 新竹";return "未分類";};
const normalizeName=s=>String(s||"").split(/[\/／]/)[0].replace(/\s/g,"").trim();
const categories=[
 {name:"餐點製作／備餐",keys:["製作","備餐","出餐","餐點","炸","烤","包裝","等餐","備料"]},
 {name:"現場忙碌／人力",keys:["忙","尖峰","排隊","人力","人手","人員","廚房","單多"]},
 {name:"設備／系統",keys:["設備","機器","故障","系統","當機","印單","網路"]},
 {name:"訂單／交接溝通",keys:["訂單","單號","通知","沒收到","未收到","聯繫","溝通","交接","找不到"]},
 {name:"其他",keys:[]}
];
function classifyReason(reason){const s=String(reason||"");for(const c of categories.slice(0,-1))if(c.keys.some(k=>s.includes(k)))return c.name;return "其他";}
function primaryCategory(causes){const counts=new Map();for(const c of causes)counts.set(c.category,(counts.get(c.category)||0)+1);return [...counts].sort((a,b)=>b[1]-a[1])[0]?.[0]||"—";}
async function fetchAll(table,columns,build){let rows=[];for(let offset=0;;offset+=1000){let q=db.from(table).select(columns);if(build)q=build(q);const r=await q.range(offset,offset+999);if(r.error)throw r.error;rows.push(...(r.data||[]));if(!r.data||r.data.length<1000)break;}return rows;}
let period="day", lastResult=null, storeByCode=new Map(), storeByName=new Map();
function currentRange(){if(period==="month"){const m=$("monthInput").value||today().slice(0,7);const [y,mo]=m.split("-").map(Number);const start=m+"-01",end=new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10);return {start,end,label:m};}const selected=$("dateInput").value||today();if(period==="day")return {start:selected,end:selected,label:selected};const dow=(new Date(selected+"T12:00:00+08:00").getDay()+6)%7;const start=shiftDate(selected,-dow),end=shiftDate(start,6);return {start,end,label:start+" ～ "+end};}
function resolveStore(row){let code=String(row.store_code||"").trim();if(!/^\d{3}$/.test(code)){const m=String(row.order_number||"").match(/(?:TWI|TWB)(\d{3})/i);if(m)code=m[1];}let store=code?storeByCode.get(code):null;if(!store){store=storeByName.get(normalizeName(row.restaurant_name));if(store)code=store.store_code;}const name=store?.restaurant_name||normalizeName(row.restaurant_name)||"未分類餐廳";return {store_code:code,restaurant_name:name,region:regionFor(name)};}
async function loadReport(){
 const {start,end,label}=currentRange();$("periodLabel").textContent=label;$("refresh").disabled=true;$("status").className="message";$("status").textContent="正在整理成績與餐廳回覆…";$("report").classList.add("hidden");
 try{
  const [restaurants,batches,delay,hours]=await Promise.all([
   fetchAll("t995_restaurants","store_code,restaurant_name,enabled",q=>q.eq("enabled",true)),
   fetchAll("t995_score_import_batches","id,report_date,report_type,imported_at,row_count",q=>q.gte("report_date",start).lte("report_date",end).order("imported_at",{ascending:false})),
   fetchAll("t995_delay_orders","record_date,store_code,restaurant_name,order_number,status,reason,responded_at,created_at",q=>q.gte("record_date",start).lte("record_date",end).order("created_at",{ascending:false})),
   fetchAll("t995_score_labor_hours","record_date,store_code,total_hours,transfer_out_hours,transfer_in_hours",q=>q.gte("record_date",start).lte("record_date",end))
  ]);
  storeByCode=new Map(restaurants.map(x=>[x.store_code,x]));storeByName=new Map(restaurants.map(x=>[normalizeName(x.restaurant_name),x]));
  const latest=new Map();for(const b of batches){const k=b.report_date+"|"+b.report_type;if(!latest.has(k))latest.set(k,b);}
  const chosen=[...latest.values()],scoreMap=new Map(),groups=[];for(let i=0;i<chosen.length;i+=10)groups.push(chosen.slice(i,i+10));
  for(const group of groups){
   const ids=group.map(b=>b.id),rows=await fetchAll("t995_score_import_rows","batch_id,store_code,restaurant_name,order_number,payload",q=>q.in("batch_id",ids)),typeById=new Map(group.map(b=>[b.id,b.report_type]));
   for(const row of rows){if(typeById.get(row.batch_id)!=="ByOrder")continue;const s=resolveStore(row),key=s.store_code||normalizeName(s.restaurant_name),v=scoreMap.get(key)||{...s,tc:0,thirdParty:0,d7Yes:0,d7Eligible:0,d25Yes:0,d25Eligible:0},p=row.payload||{};v.tc++;if(String(p["自動/手動"]||"").trim()==="第三方")v.thirdParty++;const d7=String(p.D7??"").trim().toUpperCase(),d25=String(p.D25??"").trim().toUpperCase();if(d7==="Y"||d7==="N"){v.d7Eligible++;if(d7==="Y")v.d7Yes++;}if(d25==="Y"||d25==="N"){v.d25Eligible++;if(d25==="Y")v.d25Yes++;}scoreMap.set(key,v);}
  }
  const delayMap=new Map();for(const d of delay){const s=resolveStore(d),key=s.store_code||normalizeName(s.restaurant_name),x=delayMap.get(key)||{total:0,replied:0,causes:[]};x.total++;if(d.status==="completed"&&String(d.reason||"").trim()){x.replied++;x.causes.push({reason:String(d.reason).trim(),date:d.record_date,order:d.order_number,restaurant:s.restaurant_name,store_code:s.store_code,category:classifyReason(d.reason)});}delayMap.set(key,x);}
  const allKeys=new Set([...scoreMap.keys(),...delayMap.keys()]);
  const metrics=[...allKeys].map(key=>{const found=scoreMap.get(key),store=storeByCode.get(key)||null,s=found||{store_code:store?.store_code||(/^\\d{3}$/.test(key)?key:""),restaurant_name:store?.restaurant_name||"未分類餐廳",region:regionFor(store?.restaurant_name||""),tc:0,thirdParty:0,d7Yes:0,d7Eligible:0,d25Yes:0,d25Eligible:0},d=delayMap.get(key)||{total:0,replied:0,causes:[]};return {...s,hasScore:Boolean(found),d7Rate:s.d7Eligible?s.d7Yes/s.d7Eligible:null,d25Rate:s.d25Eligible?s.d25Yes/s.d25Eligible:null,thirdPartyRate:s.tc?s.thirdParty/s.tc:null,delayTotal:d.total,replied:d.replied,causes:d.causes};});
  const totalTc=metrics.reduce((n,x)=>n+x.tc,0),totalThird=metrics.reduce((n,x)=>n+x.thirdParty,0),d7Yes=metrics.reduce((n,x)=>n+x.d7Yes,0),d7Eligible=metrics.reduce((n,x)=>n+x.d7Eligible,0),d25Yes=metrics.reduce((n,x)=>n+x.d25Yes,0),d25Eligible=metrics.reduce((n,x)=>n+x.d25Eligible,0),totalDelay=delay.length,replied=delay.filter(x=>x.status==="completed"&&String(x.reason||"").trim()).length;
  const causeMap=new Map();for(const m of metrics)for(const c of m.causes){const x=causeMap.get(c.category)||{category:c.category,count:0,examples:[]};x.count++;if(x.examples.length<2)x.examples.push(c.reason);causeMap.set(c.category,x);}const causeRows=[...causeMap.values()].sort((a,b)=>b.count-a.count);
  const restaurantReasons=metrics.filter(x=>x.causes.length).map(x=>{const counts=new Map();for(const c of x.causes)counts.set(c.category,(counts.get(c.category)||0)+1);const top=[...counts].sort((a,b)=>b[1]-a[1])[0],exact=new Map();for(const c of x.causes)exact.set(c.reason,(exact.get(c.reason)||0)+1);const common=[...exact].sort((a,b)=>b[1]-a[1])[0];return {...x,topReason:top?.[0]||"—",topReasonCount:top?.[1]||0,commonText:common?.[0]||"—"};}).sort((a,b)=>b.causes.length-a.causes.length);
  render({start,end,label,metrics,causeRows,restaurantReasons,delay,totalTc,totalThird,d7Yes,d7Eligible,d25Yes,d25Eligible,replied,totalDelay});
 }catch(e){$("status").className="message error";$("status").textContent="讀取失敗："+(e.message||"請確認登入狀態與資料表設定");}
 finally{$("refresh").disabled=false;}
}
function pct(v){return v==null?"—":(v*100).toFixed(1)+"%";}

function renderRanking(){
 if(!lastResult)return;const mode=$("rankMetric").value,labels={sstg:"SSTG",d25:"D25",d7:"D7",waiting:"等餐紀錄",thirdParty:"第三方使用率"},higher=["sstg","d25","d7"].includes(mode),candidates=lastResult.metrics.filter(x=>mode==="waiting"?x.delayTotal>0:rankValue(x,mode)!=null);

 candidates.sort((a,b)=>higher?rankValue(a,mode)-rankValue(b,mode):rankValue(b,mode)-rankValue(a,mode));
 const rows=candidates.slice(0,20).map((x,i)=>[String(i+1),x.region,x.restaurant_name,mode==="waiting"?String(x.delayTotal):pct(rankValue(x,mode)),mode==="d7"?String(x.d7Yes+"/"+x.d7Eligible):mode==="d25"?String(x.d25Yes+"/"+x.d25Eligible):String(x.tc),String(x.tc)]);
 $("worstTable").innerHTML=rows.length?table(["排名","區域","餐廳",labels[mode],mode==="waiting"?"等餐紀錄":"成功數/有效訂單","TC"],rows):"<div class='empty'>目前沒有可用的"+labels[mode]+"成績資料。</div>";
 $("insightWorst").textContent=rows.length?candidates[0].restaurant_name+"｜"+(mode==="waiting"?String(candidates[0].delayTotal)+" 筆":pct(rankValue(candidates[0],mode))):"尚無可用資料";
}
function render(r){
 lastResult=r;$("status").textContent="";$("report").classList.remove("hidden");$("kpiSstg").textContent="—";$("kpiD25").textContent=pct(r.d25Eligible?r.d25Yes/r.d25Eligible:null);$("kpiD7").textContent=pct(r.d7Eligible?r.d7Yes/r.d7Eligible:null);$("kpiDelay").textContent=r.totalDelay.toLocaleString();$("kpiThirdParty").textContent=pct(r.totalTc?r.totalThird/r.totalTc:null);
 $("insightReason").textContent=r.causeRows[0]?r.causeRows[0].category+"｜"+r.causeRows[0].count+" 筆":"尚無已回覆原因";$("insightReplyRate").textContent=r.totalDelay?Math.round(r.replied/r.totalDelay*100)+"%":"—";renderRanking();
 const areaMap=new Map();for(const x of r.metrics){const v=areaMap.get(x.region)||{region:x.region,tc:0,thirdParty:0,d7Yes:0,d7Eligible:0,d25Yes:0,d25Eligible:0,waiting:0,restaurants:0};v.tc+=x.tc;v.thirdParty+=x.thirdParty;v.d7Yes+=x.d7Yes;v.d7Eligible+=x.d7Eligible;v.d25Yes+=x.d25Yes;v.d25Eligible+=x.d25Eligible;v.waiting+=x.delayTotal;v.restaurants++;areaMap.set(x.region,v);}
 const areaOrder=["A 新竹","B 竹北","C 竹東","D 中壢","E 桃園","F 楊梅","G 大園","H 大溪龍潭","I 林口","J 大竹","K 苗栗","未分類"],areas=[...areaMap.values()].sort((a,b)=>areaOrder.indexOf(a.region)-areaOrder.indexOf(b.region));
 $("areaTable").innerHTML=areas.length?table(["區域","餐廳數","SSTG","D25","D7","等餐筆數","第三方使用率"],areas.map(x=>[x.region,String(x.restaurants),"—",pct(x.d25Eligible?x.d25Yes/x.d25Eligible:null),pct(x.d7Eligible?x.d7Yes/x.d7Eligible:null),String(x.waiting),pct(x.tc?x.thirdParty/x.tc:null)])):"<div class='empty'>沒有區域成績資料。</div>";
 const max=Math.max(1,...r.causeRows.map(x=>x.count));$("reasonBars").innerHTML=r.causeRows.length?r.causeRows.map(x=>'<div class="barrow"><div class="barlabel">'+escapeHtml(x.category)+'</div><div class="bartrack"><div class="bar" style="width:'+Math.max(4,x.count/max*100)+'%"></div></div><div class="barcount">'+x.count+'</div></div>').join(""):"<div class='empty'>此期間沒有已回覆原因。</div>";
 $("restaurantReasonTable").innerHTML=r.restaurantReasons.length?table(["餐廳","回覆筆數","主要原因類別","最常見原因"],r.restaurantReasons.map(x=>[x.restaurant_name,String(x.causes.length),x.topReason+"（"+x.topReasonCount+"）",x.commonText])):"<div class='empty'>此期間沒有已回覆原因。</div>";
 const details=r.restaurantReasons.flatMap(x=>x.causes.map(c=>({...c,restaurant:x.restaurant_name}))).sort((a,b)=>b.date.localeCompare(a.date));$("reasonDetails").innerHTML=details.length?details.slice(0,60).map(x=>'<article class="reason-item"><div class="reason-head"><span>'+escapeHtml(x.restaurant)+'｜'+escapeHtml(x.category)+'</span><span>'+escapeHtml(x.date)+'</span></div><div class="reason-text">'+escapeHtml(x.reason)+'</div><div class="reason-meta">訂單 '+escapeHtml(x.order||"—")+'</div></article>').join(""):"<div class='empty'>尚無已回覆等餐原因。</div>";
}
function table(head,rows){return '<table class="table"><thead><tr>'+head.map(x=>"<th>"+escapeHtml(x)+"</th>").join("")+"</tr></thead><tbody>"+rows.map((row,i)=>"<tr>"+row.map((v,j)=>"<td>"+(j===0&&/^[0-9]+$/.test(String(v))?'<span class="rank">'+escapeHtml(v)+'</span>':escapeHtml(v))+"</td>").join("")+"</tr>").join("")+"</tbody></table>";}
document.querySelectorAll(".periods button").forEach(b=>b.onclick=()=>{period=b.dataset.period;document.querySelectorAll(".periods button").forEach(x=>x.classList.toggle("active",x===b));$("dateInput").classList.toggle("hidden",period==="month");$("monthInput").classList.toggle("hidden",period!=="month");loadReport();});$("rankMetric").onchange=renderRanking;
$("refresh").onclick=loadReport;
$("dateInput").value=today();$("monthInput").value=today().slice(0,7);
$("export").onclick=()=>{if(!lastResult||!window.XLSX)return;const r=lastResult,wb=XLSX.utils.book_new();const scores=r.metrics.map(x=>({區域:x.region,店號:x.store_code,餐廳:x.restaurant_name,TC:x.tc,SSTG:"",D25達成率:x.d25Rate??"",D25成功數:x.d25Yes,D25有效訂單:x.d25Eligible,D7達成率:x.d7Rate??"",D7成功數:x.d7Yes,D7有效訂單:x.d7Eligible,等餐紀錄:x.delayTotal,第三方使用率:x.thirdPartyRate??"",第三方訂單:x.thirdParty}));const causes=r.restaurantReasons.map(x=>({餐廳:x.restaurant_name,回覆筆數:x.causes.length,主要原因:x.topReason,最常見原因:x.commonText}));const details=r.restaurantReasons.flatMap(x=>x.causes.map(c=>({日期:c.date,餐廳:x.restaurant_name,訂單:c.order,原因分類:c.category,餐廳回覆:c.reason})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{報表期間:r.label,TC:r.totalTc,SSTG:"需去年同期餐廳TC基準",D25達成率:r.d25Eligible?r.d25Yes/r.d25Eligible:"",D7達成率:r.d7Eligible?r.d7Yes/r.d7Eligible:"",等餐紀錄:r.totalDelay,第三方使用率:r.totalTc?r.totalThird/r.totalTc:"",原因回覆:r.replied}]),"摘要");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(scores),"餐廳成績");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(causes),"原因彙總");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(details),"原因明細");XLSX.writeFile(wb,"T995_"+period+"_"+r.start+".xlsx");};
(async()=>{try{const {data,error}=await db.auth.getSession();if(error)throw error;if(!data.session){$("authMessage").classList.remove("hidden");$("authMessage").innerHTML='請先登入營運後台，再開啟分析儀表板。<br><a href="admin.html">前往登入</a>';return;}$("dashboard").classList.remove("hidden");await loadReport();}catch(e){$("authMessage").classList.remove("hidden");$("authMessage").textContent="登入狀態讀取失敗："+(e.message||"請先登入營運後台");}})();
</script>
