<header><div class="topline"><div class="brand">KFC DELIVERY CENTER｜T995</div><a class="back" href="admin.html">返回後台</a></div><h1>營運分析儀表板</h1><div class="subtitle">成績追蹤與因素分析</div></header>
<div class="wrap"><main>
<div id="authMessage" class="panel hidden"></div>
<div id="dashboard" class="hidden">
  <div class="period-toolbar">
    <div class="periods" role="tablist" aria-label="報表週期"><button type="button" data-period="day" class="active">日</button><button type="button" data-period="week">週</button><button type="button" data-period="month">月</button></div>
    <button id="periodPickerToggle" class="secondary" type="button" aria-expanded="false">選擇日期</button>
    <div id="periodPicker" class="period-picker hidden"><div class="period-nav"><button id="periodPrev" type="button" aria-label="上一段">‹</button><div id="periodChoices" class="period-choices"></div><button id="periodNext" type="button" aria-label="下一段">›</button></div></div>
    <button id="refresh" class="secondary" type="button">重新整理</button><button id="export" class="primary" type="button">匯出 Excel</button>
  </div>
  <div id="status" class="period-status" role="status"></div>
  <div id="report" class="dashboard-layout hidden">
    <aside class="panel score-board"><h2>成績切換</h2><nav id="metricTabs" class="metric-tabs hidden" aria-label="成績分析項目"></nav></aside>
    <section class="panel metric-detail"><h2 id="metricTitle"></h2><div id="metricSubtitle" class="metric-subtitle"></div><div id="metricContent"></div></section>
  </div>
</div>
</main></div>
<script src="analysis-dashboard.js?v=20261030-courier-3min-groups1"></script>
