<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f0e8">
<title>T995｜營運分析儀表板</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="operations-metrics.js?v=20261027-dashboard1"></script>
<script src="operations-summary.js?v=20261027-dashboard1"></script>
<style>
:root{--red:#c8102e;--ink:#242424;--muted:#77736d;--bg:#f4f0e8;--paper:#fff;--line:#ddd8ce;--green:#356b4b;--amber:#9a6b00;--shadow:0 5px 20px rgba(31,24,18,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","微軟正黑體",Arial,sans-serif;text-align:center;font-weight:600}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1440px;margin:auto;padding:0 16px 40px}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 14px}.topline{max-width:1440px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:13px;letter-spacing:2px;font-weight:900}.back{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;text-decoration:none;color:var(--ink);font-weight:900}h1{margin:12px 0 4px;font-size:clamp(24px,4vw,36px)}.subtitle{font-size:14px;font-weight:800}main{padding-top:16px}.toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}.periods,.week-tabs{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.periods{padding:4px;background:#f7f4ee;border:1px solid var(--line);border-radius:11px}.periods button,.week-tabs button{border:0;border-radius:8px;padding:9px 14px;background:transparent;font-weight:900}.periods button.active,.week-tabs button.active{background:var(--red);color:#fff}.datebox{min-height:42px;padding:8px 11px;border:1px solid var(--line);background:#fff;border-radius:9px;text-align:center}.primary,.secondary{border:0;border-radius:9px;padding:10px 16px;background:var(--red);color:#fff;font-weight:900}.primary:disabled{opacity:.6;cursor:wait}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.week-row{margin:0 auto 12px}.week-tabs button{border:1px solid var(--line);background:#fff;min-width:68px}.week-tabs button span{display:block;font-size:10px;font-weight:700}.status{min-height:20px;margin:8px auto;font-size:14px;font-weight:800}.status.error{color:#b42318}.status.notice{color:var(--amber)}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:18px;margin:0 0 10px}.panel h3{font-size:15px;margin:0 0 8px}.hidden{display:none!important}.period-title{font-size:17px;font-weight:900;margin:8px 0 12px}.coverage{border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:10px;padding:10px 12px;margin:0 0 12px;background:#fffbef;font-weight:800}.coverage.good{border-left-color:var(--green);background:#f1f8f3}.coverage.error{border-left-color:var(--red);background:#fff3f4}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 8px;box-shadow:var(--shadow)}.kpi-label{font-size:13px;font-weight:900}.kpi-value{font-size:25px;font-weight:900;margin-top:5px;overflow-wrap:anywhere}.kpi-unit{font-size:12px;margin-left:3px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;margin-bottom:12px}.scroll{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 7px;border-bottom:1px solid #eee9e1;text-align:center;white-space:nowrap}.table th{position:sticky;top:0;background:#faf8f4;font-weight:900}.table tfoot th,.table tfoot td{font-weight:900;background:#f8f4ed}.area-tag{border-radius:99px;background:#f5f0e9;padding:3px 8px;font-weight:900}.empty{padding:18px;font-weight:800}.daily{margin-bottom:12px}.weather-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.weather-card{border:1px solid var(--line);border-radius:12px;padding:12px}.weather-card strong{display:block;font-size:17px;margin:4px}.weather-note{font-size:12px;margin-top:8px}.bars{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:minmax(90px,140px) 1fr 42px;gap:8px;align-items:center;text-align:left}.bartrack{height:12px;background:#f1ede6;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--red)}.barlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.barcount{font-weight:900;text-align:right}.ranking{display:grid;gap:7px}.ranking article{display:flex;gap:9px;align-items:center;text-align:left;border-bottom:1px solid #eee9e1;padding:7px}.rank{font-weight:900;color:var(--red);width:24px}.rank-name{font-weight:900;flex:1}.rank-value{font-weight:900}.chart{width:100%;height:auto;min-height:180px}.actions{display:flex;justify-content:center;margin:12px 0}.hint{font-size:13px;font-weight:800}
@media(max-width:960px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
.hour-input{width:88px;max-width:100%;min-height:38px;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:center;font-weight:800;background:#fff}.labor-adjust{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px;margin-top:10px}.labor-adjust label{display:grid;gap:6px;align-content:center;border:1px solid var(--line);border-radius:9px;padding:9px;font-weight:900}.labor-adjust output{font-size:17px}.labor-adjust input{width:100%}
@media(max-width:600px){.wrap{padding:0 7px 28px}.topline{align-items:center}.brand{letter-spacing:1px;font-size:11px}.back{padding:8px;font-size:13px}.toolbar{padding:9px 6px;gap:6px}.periods{width:100%}.periods button{flex:1;padding:9px 4px}.datebox{width:100%}.primary{width:100%}.week-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.week-tabs button{min-width:0;padding:7px 2px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.kpi{padding:11px 5px}.kpi-label{font-size:12px}.kpi-value{font-size:22px}.panel{padding:11px 6px}.table{font-size:11px}.table th,.table td{padding:8px 5px}.weather-cards{grid-template-columns:1fr}.barrow{grid-template-columns:85px 1fr 32px}.panel h2{font-size:16px}.labor-adjust{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="topline"><div class="brand">KFC DELIVERY CENTER｜T995</div><a class="back" href="admin.html">返回後台</a></div><h1>營運分析儀表板</h1><div class="subtitle">成績・區域工時・天氣・等餐原因</div></header>
<div class="wrap"><main>
<div id="authMessage" class="panel hidden"></div>
<div id="dashboard" class="hidden">
  <div class="toolbar">
    <div class="periods" role="tablist" aria-label="報表週期"><button type="button" data-period="day" class="active">日</button><button type="button" data-period="week">週</button><button type="button" data-period="month">月</button></div>
    <input id="dateInput" class="datebox" type="date" aria-label="選擇報表日期">
    <input id="monthInput" class="datebox hidden" type="month" aria-label="選擇報表月份">
    <button id="refresh" class="primary" type="button">重新整理</button>
    <button id="export" class="secondary" type="button">匯出 Excel</button>
  </div>
  <div id="weekRow" class="week-row hidden"><div id="weekTabs" class="week-tabs" role="tablist" aria-label="選擇週次"></div></div>
  <div id="status" class="status" role="status"></div>
  <div id="report" class="hidden">
    <div id="periodTitle" class="period-title"></div>
    <div id="coverage" class="coverage"></div>
    <section id="kpis" class="kpis"></section>
    <div class="grid">
      <section class="panel"><h2>各區成績與工時</h2><div id="areaTable" class="scroll"></div></section>
      <section class="panel"><h2>新竹／桃園天氣</h2><div id="weather"></div></section>
    </div>
    <div class="grid">
      <section class="panel"><h2 id="dailyTitle">每日成績</h2><div id="dailyTable" class="scroll"></div></section>
      <section class="panel"><h2>本期餐廳指標排行</h2><div id="ranking" class="ranking"></div></section>
    </div>
    <div class="grid">
      <section class="panel"><h2>等餐原因分類</h2><div id="reasonBars" class="bars"></div></section>
      <section class="panel"><h2>等餐原因回覆</h2><div id="reasonSummary"></div></section>
    </div>
    <section class="panel daily"><h2>各區每日／整月工時</h2><div id="hoursTable" class="scroll"></div></section>
  </div>
</div>
</main></div>
<script src="analysis-dashboard.js?v=20261027-dashboard2"></script>
</body>
</html>
