<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全區總覽｜外送事業部</title>
<link rel="stylesheet" href="ui-shell.css">
<script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* 四區識別色：dataviz 分類色 1–4（已跑色盲驗證）。狀態色只用於達標／未達標，並一律附文字或符號。 */
:root{--c995:#2a78d6;--c996:#eb6834;--c998:#1baf7a;--c981:#eda100;
 --dv-n:#f0efec;--dv-b1:#d3e3f7;--dv-b2:#8db8ea;--dv-b3:#2a78d6;--dv-r1:#f7d9d9;--dv-r2:#ec9a9a;--dv-r3:#d03b3b;--good-bg:#E6F6EA}
[data-theme=dark]{--c995:#3987e5;--c996:#d95926;--c998:#199e70;--c981:#c98500;
 --dv-n:#383835;--dv-b1:#22374f;--dv-b2:#2d5a8f;--dv-b3:#3987e5;--dv-r1:#4a2626;--dv-r2:#7d3434;--dv-r3:#e66767;--good-bg:#1C3324}
.top button,.top .seg button{white-space:nowrap}.top .right{gap:10px}.top .user{white-space:nowrap}
.demo{background:#FFF4D6;color:var(--warn);text-align:center;font-size:13px;padding:6px}
.side .dim{opacity:.5}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.basis{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tabs{display:flex;justify-content:center;margin:0 0 22px}
.tabs .seg button{padding:8px 20px;font-size:15px}
.pane{display:none}.pane.on{display:block}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.hero .kpi{cursor:default;display:flex;flex-direction:column;align-items:center}
.hero .kpi svg{width:100%;height:34px;margin-top:6px}
.delta{font-size:12px;font-weight:700;white-space:nowrap}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.flat{color:var(--faint)}
.chipbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:12px;border-radius:999px;padding:3px 10px;cursor:pointer}
.chipbtn.on{background:var(--text);color:var(--card);border-color:var(--text)}
.rcs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.lights{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;margin-bottom:22px}
.lg{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border-top:4px solid var(--rc);padding:14px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:132px;justify-content:center}
.lg:hover{outline:2px solid var(--rc)}
.lg h3{margin:0;font-size:15px;font-weight:800}
.lg .dots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%}
.lt{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);gap:2px}
.lt i{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;color:#fff}
.lt.ok i{background:var(--ok)}.lt.bad i{background:var(--bad)}.lt.na i{background:var(--seg);color:var(--na)}
.lg b{font-size:13px}.lgs{font-size:11px;color:var(--faint);font-weight:500;margin-top:-6px}.lg b.ok{color:var(--ok)}.lg b.bad{color:var(--bad)}
.lg.off{border-top-color:var(--line);cursor:default;color:var(--faint)}.lg.off:hover{outline:0}
.lg.off .lt i{background:var(--seg);border:1px dashed var(--line)}
.rc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;border-top:4px solid var(--rc);display:flex;flex-direction:column;gap:6px}
.rc h3{margin:0 0 4px;font-size:17px;font-weight:800;text-align:center}
.rc h3 small{display:block;font-size:12px;color:var(--faint);font-weight:500;margin-top:2px}
.mhead,.mrow{display:grid;grid-template-columns:84px repeat(3,minmax(0,1fr));text-align:center}
.mhead{font-size:12px;color:var(--faint);font-weight:600;padding:2px 0 4px;border-bottom:1px solid var(--line)}
.mrow .l{text-align:left}.mrow .v{text-align:center!important}.mrow .tg,.mrow .dl{text-align:center!important}
.fb,.fw{font-style:normal;font-size:11px;margin-left:4px;vertical-align:2px}.fb{color:var(--ok)}.fw{color:var(--bad)}
.bstat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.bstat div{background:var(--soft);border-radius:8px;padding:6px 4px;text-align:center}.bstat span{display:block;font-size:11px;color:var(--muted)}.bstat b{font-size:15px}.bstat b small{font-size:11px;color:var(--faint);font-weight:500}.bstat .bad b{color:var(--bad)}
.rc{cursor:pointer}.rc:hover{outline:2px solid var(--rc)}
.mrow{height:40px;align-items:center;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
.mrow .l{color:var(--muted);line-height:1.2}.mrow .v{font-weight:800;text-align:right;font-size:15px}
.mrow .v.ok{color:var(--ok)}.mrow .v.bad{color:var(--bad)}.mrow .v.na{color:var(--na);font-size:12px}
.mrow .sub2{font-size:11px;color:var(--faint);font-weight:500}
.pbar{height:8px;background:var(--seg);border-radius:999px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--muted)}
.pbar.ok i{background:var(--ok)}.pbar.bad i{background:var(--bad)}
.pbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
.mrow svg{width:70px;height:22px}
.flag{display:inline-block;font-size:10px;border-radius:999px;padding:0 6px;font-weight:700;margin-top:2px}
.flag.best{background:var(--good-bg);color:var(--ok)}.flag.worst{background:var(--miss);color:var(--bad)}
.alerts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.alerts .chip{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tg{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--seg);color:var(--muted)}
.chip.warn{background:#FFF4D6;color:var(--warn)}.chip.bad{background:var(--miss);color:var(--bad)}
[data-theme=dark] .chip.warn{background:#3a3016}
.rc .go{text-align:right;color:var(--red);text-decoration:none;font-size:13px;margin-top:auto}
.insight{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.insight li{display:grid;grid-template-columns:28px 1fr;gap:8px;line-height:1.6;font-size:14px}
.insight li>span{font-size:18px;text-align:center}
.insight small{display:block;color:var(--faint);font-weight:500;font-size:12px}
.toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.hbars{display:grid;gap:14px}
.hb{display:grid;grid-template-columns:110px 1fr 96px;gap:10px;align-items:center;font-size:14px}
.hb .track{height:22px;background:var(--seg);border-radius:4px;position:relative}
.hb .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.hb .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text)}
.hb .val{text-align:right;font-weight:800}
.acblk .track{height:12px}.acblk .tick{top:-3px;bottom:-3px}.acblk .hb{font-size:12px}.acblk{display:grid;gap:3px;padding:4px 0;border-bottom:1px solid var(--line)}.acblk:last-child{border-bottom:0}.acblk>b{font-size:14px}.acblk .hb{grid-template-columns:44px 1fr 86px}
#acBars{gap:4px}
.heatwrap{overflow-x:auto}
.heat .cell{height:30px;border-radius:3px;cursor:default}
.heat .rl{display:flex;align-items:center;font-size:13px;font-weight:700;white-space:nowrap;padding-right:6px}
.heat .dl{text-align:center;color:var(--faint);font-weight:500;font-size:11px;white-space:nowrap}
.dvlegend{display:flex;justify-content:center;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.dvlegend i{display:inline-block;width:26px;height:12px;border-radius:2px}
.matrix td{text-align:center;font-weight:700;height:52px;border-bottom:2px solid var(--card)}.matrix td small{display:block;font-size:11px;font-weight:500}
.matrix th{text-align:center;position:static}.matrix td:first-child,.matrix th:first-child{text-align:left}
.trend svg{width:100%;height:300px;display:block;overflow:visible}
.gridl line{stroke:var(--line);stroke-width:1}.ax{fill:var(--faint);font-size:11px;font-weight:500}
.tgt{stroke:var(--muted);stroke-dasharray:5 4;stroke-width:1.5}.lbl{font-size:12px;font-weight:700;fill:var(--text)}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 0 8px}
.legend .ln{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:4px;margin-right:6px}
.tip{position:fixed;pointer-events:none;background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;display:none;min-width:150px;z-index:50}
.tip div{display:flex;justify-content:space-between;gap:12px}
.note{color:var(--faint);font-size:12px;font-weight:500;text-align:center;margin:8px 0 0}
.regpick{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.regpick button{border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;border-radius:10px;padding:8px 16px;cursor:pointer}
.regpick button.on{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc) inset}
.mini svg{width:100%;height:200px;display:block}
.storelist{list-style:none;margin:0;padding:0}
.storelist li{display:grid;grid-template-columns:1fr auto;gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.storelist li small{grid-column:1/-1;color:var(--faint);font-weight:500;font-size:12px}
.storelist .up{color:var(--ok)}.storelist .down{color:var(--bad)}
.sev{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}
.sev.critical{background:var(--miss);color:var(--bad)}.sev.serious{background:#FDEBDD;color:#B4541C}.sev.warning{background:#FFF4D6;color:var(--warn)}
[data-theme=dark] .sev.serious{background:#3d2618;color:#ec835a}[data-theme=dark] .sev.warning{background:#3a3016}
.st{font-size:12px;border-radius:6px;padding:2px 8px;white-space:nowrap}
.st.todo{background:var(--seg);color:var(--muted)}.st.doing{background:#FFF4D6;color:var(--warn)}.st.done{background:var(--good-bg);color:var(--ok)}.st.late{background:var(--miss);color:var(--bad)}
[data-theme=dark] .st.doing{background:#3a3016}
.alerttable th,#areaTable th{position:static}#areaTable td{padding:11px 10px}.alerttable td{vertical-align:top;line-height:1.5}.alerttable small{display:block;color:var(--faint);font-weight:500}
.stack{display:flex;height:22px;gap:2px}.stack div{height:100%}.stack div:first-child{border-radius:4px 0 0 4px}.stack div:last-child{border-radius:0 4px 4px 0}
.stackrow{display:grid;grid-template-columns:100px 1fr 60px;gap:10px;align-items:center;margin:12px 0;font-size:14px}
.report{background:var(--soft);border-radius:10px;padding:14px 16px;line-height:1.8;font-size:14px;white-space:pre-wrap;font-weight:500}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btnrow button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer}
.btnrow .primary{background:var(--red);color:#fff;border-color:var(--red)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px}
.g32{display:grid;grid-template-columns:3fr 2fr;gap:20px;margin-bottom:22px}
.mb{margin-bottom:22px}
.ev{display:none;color:var(--faint);font-size:12px;font-weight:500;margin-top:2px}.open .ev{display:block}
.tgl{cursor:pointer}.tgl .more{color:var(--faint);font-size:12px;margin-left:6px}
details.card>summary{list-style:none;cursor:pointer;text-align:center;font-size:18px;font-weight:800}details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:' ▾';color:var(--faint)}details.card[open]>summary::after{content:' ▴'}details.card[open]>summary{margin-bottom:12px}
.vw{display:none}.vw.on{display:block}
.golink{display:block;max-width:360px;margin:0 auto;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;text-align:center;text-decoration:none;color:var(--text);font-weight:800;border-top:4px solid var(--rc)}
.dq{width:100%}.dq th{position:static;text-align:center}.dq td{text-align:center;font-size:13px}.dq td:first-child,.dq th:first-child{text-align:left;white-space:nowrap}
.dq .y{color:var(--ok)}.dq .n{color:var(--bad);font-weight:700}.dq .off{color:var(--na)}
.eff{width:100%}.eff th{position:static;text-align:center}.eff td{text-align:center;font-size:13px}.eff td:first-child,.eff th:first-child{text-align:left}
.links{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.links a{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 8px;text-align:center;text-decoration:none;color:var(--text);font-weight:700;border-top:4px solid var(--rc)}
.links a:hover{outline:2px solid var(--rc)}
.gap{font-weight:800;color:var(--bad);white-space:nowrap}
.g2>.card{display:flex;flex-direction:column}.g2>.card>.hbars,.g2>.card>.storelist,.g2>.card>.insight{flex:1;align-content:space-evenly}.g2>.card>.note{margin-top:auto}
.hero{grid-template-columns:repeat(4,minmax(0,1fr))}.g2>*,.g32>*,.rcs>*,.hero>*{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1300px){.lights{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.rcs{grid-template-columns:1fr}}
@media (max-width:900px){.g2,.g32{grid-template-columns:1fr}.hero{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
 .app{grid-template-columns:1fr}.side{display:none}
 .top{height:auto;flex-direction:column;gap:8px;padding:10px 12px}.top .right{flex-wrap:wrap;justify-content:center}
 .period b{min-width:0;font-size:14px}.page{padding:16px 10px 40px}
 .tabs .seg{display:grid;grid-template-columns:repeat(2,1fr);width:100%}.tabs .seg button{padding:8px 6px;font-size:14px}
 .hero{gap:10px}.hero .kpi b{font-size:22px}
 .mhead,.mrow{grid-template-columns:56px repeat(3,minmax(0,1fr))}
 .hb{grid-template-columns:76px 1fr 80px;font-size:13px}
 .cmp table,.matrix{font-size:12px}.cmp table{min-width:620px}
 .alerttable{min-width:680px}
 .mrow{font-size:12px}.mrow .v{font-size:14px}.bstat b{font-size:13px}
 .links{grid-template-columns:repeat(2,minmax(0,1fr))}
 .dq td,.eff td{font-size:12px;padding:8px 4px}
 .lights{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lt i{width:20px;height:20px}
 #areaTable{min-width:560px}#areaTable td:first-child{white-space:nowrap}
 .stackrow{grid-template-columns:70px 1fr 44px}
}

.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.login form{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:28px 26px;width:min(360px,92vw);display:grid;gap:12px;text-align:center}
.login h2{margin:0 0 4px;font-size:20px}.login input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.login button{font:inherit;font-weight:800;padding:10px;border:0;border-radius:8px;background:var(--red);color:#fff;cursor:pointer}
.login .msg{font-size:13px;color:var(--bad);min-height:18px}
.loading{text-align:center;color:var(--muted);padding:30px}
.rc.err{border-top-color:var(--bad)}.rc.err .errmsg{color:var(--bad);text-align:center;padding:30px 0}
.note2{font-size:12px;color:var(--faint);text-align:center;margin-top:6px}

h2.sec{font-size:18px;font-weight:800;text-align:center;margin:22px 0 12px}
.mx{display:grid;gap:4px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:10px}
.mx .hd{text-align:center;font-size:13px;color:var(--muted);font-weight:800;padding:6px 0}
.mx .rg{display:flex;align-items:center;font-weight:800;font-size:15px;border-left:4px solid var(--rc);padding-left:10px}
.cell{border-radius:10px;padding:14px 6px;text-align:center;cursor:pointer;border:2px solid transparent;min-height:56px;display:flex;align-items:center;justify-content:center}
.cell b{font-size:20px;font-weight:800}.cell b i{font-style:normal;font-size:12px;margin-left:3px}
.cell.ok b{color:var(--ok)}.cell.bad{background:var(--miss)}.cell.bad b{color:var(--bad)}.cell.na b{color:var(--na);font-size:13px}.cell.sel{border-color:var(--text)}
.why{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 20px;margin-top:12px;display:none}.why.on{display:block}
.why h3{margin:0 0 6px;text-align:center;font-size:17px}
.pcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pc{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border-top:4px solid var(--rc);padding:16px;display:flex;flex-direction:column;gap:6px;text-align:center;cursor:pointer}
.pc h3{margin:0;font-size:15px;font-weight:800}.pc .big{font-size:28px;font-weight:800;color:var(--bad)}.pc .gap{font-size:14px;font-weight:800;color:var(--bad)}
.src{list-style:none;margin:6px 0 0;padding:0;text-align:center;border-top:1px solid var(--line)}
.src li{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:4px 14px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}
.pc .src li{grid-template-columns:minmax(0,1fr) auto;}.pc .src li:nth-child(n+4){display:none}.pc .src li .counts{grid-column:1/-1;font-weight:500;color:var(--faint);font-size:11px}
.src li b{font-weight:800}.src li em{font-style:normal;color:var(--ok);font-weight:800;white-space:nowrap}.dimbar{margin:4px 0 10px}.dimseg button{padding:5px 14px}
.src .counts{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}.src .missing{color:var(--na);font-weight:800}.mx .rg{justify-content:center;padding:0;border-left-width:4px}.dimseg{display:flex;flex-wrap:wrap;justify-content:center}.pc h3,.src b{overflow-wrap:anywhere}button:disabled{opacity:.5;cursor:wait}
@media (max-width:1100px){.pcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.mxwrap{overflow-x:auto}.mx{min-width:600px}.cell b{font-size:16px}.pcards{grid-template-columns:1fr}.top .period{flex-wrap:wrap;justify-content:center}}
</style>
</head>
<body>
<div class="login" id="login"><form id="loginForm"><h2>全區總覽</h2><div style="color:var(--muted);font-size:13px">總部帳號登入（一次登入四區）</div>
<input id="em" type="email" placeholder="Email" autocomplete="username" required><input id="pw" type="password" placeholder="密碼" autocomplete="current-password" required>
<button type="submit">登入</button><div class="msg" id="loginMsg"></div></form></div>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">KFC</span><div><b>外送事業部</b><small>全區總覽</small></div></div>
    <nav id="sideNav">
      <a class="active" href="#" data-go="ov">🌐 全區總覽</a>
      <div class="group">各區後台</div>
    </nav>
  </aside>
  <main>
    <header class="top">
      <div class="period">
        <div class="seg" id="unit"><button data-u="day">日</button><button data-u="week" class="on">週</button><button data-u="month">月</button></div>
        <button class="icon" id="prev">‹</button><b id="periodLabel">—</b><button class="icon" id="next">›</button><button class="ghost" id="today">本週</button>
      </div>
      <div class="right">
        <span class="seg" id="cut" title="截止日"><button data-c="common" class="on">共同截止</button><button data-c="latest">各區最新</button></span>
        <span class="seg" id="basis"><button data-b="gap" class="on">目標差距</button><button data-b="prev">前期變化</button></span>
        <button class="ghost" id="reload">🔄 重新讀取</button><button class="theme">🌙 夜間</button><span class="user" id="userBox">—</span>
      </div>
    </header>
    <section class="page">
      <h1>全區總覽</h1>

<script>
'use strict';
const CENTERS=[
 {id:'995',name:'桃園',c:'--c995',url:'https://nurnboqwhctyswcufkyk.supabase.co',key:'sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G'},
 {id:'996',name:'台中',c:'--c996',url:'https://sumcbwhaksuktsplenxy.supabase.co',key:'sb_publishable_Rhx8DoZnDgRAaS397TR4Pg_eCpI9RGj'},
 {id:'998',name:'台南',c:'--c998',url:'https://flismbitnsaffebsepos.supabase.co',key:'sb_publishable_HjkU0Bonn1HyfxG19sAx-A_3tAcz8_W'},
 {id:'981',name:'高雄',c:'--c981',url:'https://fmykglrkhtncpbnemakc.supabase.co',key:'sb_publishable_JnDACuP-j3LI6IgDXvYM0g_EqrBJiBn'}];
const OFF=[{id:'997',name:'台北'},{id:'994',name:'新北'}];
const DEFAULT_T={sstg:.042,d7:.25,d25:.70,fa:.25,tplh:2.0};
const M=[
 {k:'tc',l:'TC',hi:true,f:x=>Math.round(x).toLocaleString('en-US'),noTarget:true,noRank:true},
 {k:'sstg',l:'SSTG',hi:true,f:x=>(x>=0?'+':'−')+Math.abs(x*100).toFixed(1)+'%',pt:true},
 {k:'d7',l:'D7',hi:true,f:x=>(x*100).toFixed(1)+'%',pt:true},
 {k:'d25',l:'D25',hi:true,f:x=>(x*100).toFixed(1)+'%',pt:true},
 {k:'fa',l:'FA 佔比',hi:false,f:x=>(x*100).toFixed(1)+'%',cap:true,pt:true},
 {k:'tplh',l:'TPLH',hi:true,f:x=>x.toFixed(2)}];
const MK=Object.fromEntries(M.map(m=>[m.k,m]));
const $=id=>document.getElementById(id);
const clients=Object.fromEntries(CENTERS.map(c=>[c.id,supabase.createClient(c.url,c.key,{auth:{storageKey:'hq-overview-'+c.id,persistSession:true,autoRefreshToken:true}})]));
// ===== 日期（Asia/Taipei）=====
const tz=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
const dow=d=>new Date(d+'T12:00:00Z').getUTCDay();
const md=d=>d?(+d.slice(5,7))+'/'+(+d.slice(8,10)):'—';
const isoWeek=d=>{const x=new Date(d+'T12:00:00Z');const t=new Date(x);t.setUTCDate(x.getUTCDate()+3-((x.getUTCDay()+6)%7));const y=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-y)/864e5-3+((y.getUTCDay()+6)%7))/7);};
let unit='week',anchor=tz(),cutoff='common',basis='gap',cmpK='d7',deepId='995';
function period(u=unit,a=anchor){if(u==='day')return{start:a,end:a,label:md(a)};if(u==='week'){const s=addDays(a,-((dow(a)+6)%7));return{start:s,end:addDays(s,6),label:'W'+isoWeek(s)+'　'+md(s)+'–'+md(addDays(s,6))};}
 const s=a.slice(0,8)+'01',e=addDays(new Date(Date.UTC(+a.slice(0,4),+a.slice(5,7),0,12)).toISOString().slice(0,10),0);return{start:s,end:e,label:a.slice(0,4)+'/'+(+a.slice(5,7))+' 月'};}
function shift(n){if(unit==='day')anchor=addDays(anchor,n);else if(unit==='week')anchor=addDays(anchor,7*n);else{const d=new Date(anchor+'T12:00:00Z');d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);anchor=d.toISOString().slice(0,10);}}
function prevPeriod(p){if(unit==='month'){const d=new Date(p.start+'T12:00:00Z');d.setUTCMonth(d.getUTCMonth()-1);const s=d.toISOString().slice(0,10);const e=new Date(Date.UTC(+s.slice(0,4),+s.slice(5,7),0,12)).toISOString().slice(0,10);return{start:s,end:e};}const n=unit==='day'?1:7;return{start:addDays(p.start,-n),end:addDays(p.end,-n)};}
// ===== 讀取 =====
const LOCAL_PREVIEW=/^(127\.0\.0\.1|localhost)$/.test(location.hostname)&&new URLSearchParams(location.search).has('preview');
async function summary(id,start,end){
 if(LOCAL_PREVIEW){const r=await fetch(`/hq-rpc?id=${id}&start=${start}&end=${end}`);const j=await r.json();if(j.error)throw new Error(j.error);return j.data;} // 本機預覽：由本機伺服器以測試帳號身分呼叫，不經登入
 const r=await clients[id].rpc('hq_summary',{p_start:start,p_end:end});if(r.error)throw r.error;return r.data;}
function metrics(s){if(!s)return null;const tc=s.tc,ok=tc!==null&&tc!==undefined;const r=(y,n)=>y!=null&&n!=null&&y+n>0?y/(y+n):null;
 return{tc:ok?tc:null,sstg:s.sstg??null,d7:r(s.d7_y,s.d7_n),d25:r(s.d25_y,s.d25_n),fa:ok&&tc>0&&s.fa!=null?s.fa/tc:null,tplh:s.nonfa!=null&&s.actual_hours>0?s.nonfa/s.actual_hours:null,
  sameTc:s.same_store_tc??null,samePrior:s.same_store_prior_tc??null,newTc:s.new_store_tc??0,nonfa:s.nonfa,sssg:s.sssg??null,y7:s.d7_y,v7:s.d7_y!=null?s.d7_y+s.d7_n:null,y25:s.d25_y,v25:s.d25_y!=null?s.d25_y+s.d25_n:null,faN:s.fa};}
let R=[],RK={},TR=null,loading=true;
let loadSeq=0;
async function load(){
 loading=true;exportEnabled();$('why').classList.remove('on');
 const seq=++loadSeq,p=period(),today=tz();$('periodLabel').textContent=p.label;$('today').textContent=unit==='day'?'今天':unit==='week'?'本週':'本月';
 $('mx').innerHTML='<div class="loading">讀取四區資料中…</div>';$('pcards').innerHTML='';TR=null;
 const end0=p.end>today?today:p.end;
 const first=await Promise.all(CENTERS.map(async c=>{try{return{c,s:await summary(c.id,p.start,end0)}}catch(e){return{c,err:e.message||String(e)}}}));
 const lasts=first.filter(x=>x.s?.last_score_date&&x.s.last_score_date>=p.start).map(x=>x.s.last_score_date);
 const common=lasts.length?lasts.reduce((a,b)=>a<b?a:b):end0;
 const useEnd=cutoff==='common'?(common<end0?common:end0):end0;
 if(seq!==loadSeq)return;
 const pp=prevPeriod({start:p.start,end:useEnd});
 const loaded=await Promise.all(first.map(async x=>{const c=x.c;if(x.err)return{...c,err:x.err};
   try{const s=cutoff==='common'&&useEnd!==end0?await summary(c.id,p.start,useEnd):x.s;
     const prev=basis==='prev'?await summary(c.id,pp.start,pp.end).catch(()=>null):null;
     const t={...DEFAULT_T};for(const[k,v] of Object.entries(s.targets||{}))if(v!=null){const kk=k==='faShareMax'?'fa':k;t[kk]=Number(v);}
     const v=metrics(s),cov=s.coverage||{};
     return{...c,s,v,t,prev:metrics(prev),upd:s.last_score_date&&s.last_score_date>useEnd?useEnd:s.last_score_date,b:{ano:s.b_layer?.anomaly_days,wait:s.b_layer?.waiting_count,sig:s.b_layer?.line_signature_missing_count,gap:(cov.scores?.missing_dates||[]).length},
       subs:[...(s.prior_substitutions||[]),...(s.store_substitutions||[])],newStores:s.new_stores||[],cov,actions:s.actions||{}};}
   catch(e){return{...c,err:e.message||String(e)}}}));
 if(seq!==loadSeq)return;
 R=loaded;loading=false;exportEnabled();
 RK=Object.fromEntries(M.map(m=>[m.k,rank(m.k)]));
 $('cut').querySelector('[data-c=common]').textContent='共同 '+md(useEnd);
 window.__period={...p,useEnd};render();}
// ===== 共用 =====
const ok=()=>R.filter(r=>!r.err&&r.v);
function rank(k){const m=MK[k];if(m.noRank)return{};if(new Set(ok().map(r=>r.upd)).size>1)return{};const rs=ok().filter(r=>r.v[k]!=null);if(rs.length<2)return{};const vals=rs.map(r=>r.v[k]);const b=m.hi?Math.max(...vals):Math.min(...vals),w=m.hi?Math.min(...vals):Math.max(...vals);const o={};rs.forEach(r=>{if(r.v[k]===b)o[r.id]='best';else if(r.v[k]===w)o[r.id]='worst';});return o;}
const status=(k,r,x=r.v?.[k])=>{const m=MK[k];if(x==null)return'na';if(m.noTarget)return'';const t=r.t[k];return(m.cap?x<=t:x>=t)?'ok':'bad';};
const tgtTxt=(k,r)=>{const m=MK[k];return m.noTarget?'':(m.cap?'上限 ':'目標 ')+m.f(r.t[k]);};
const rn=r=>`${r.id} ${r.name}`;
function delta(k,r){const m=MK[k],x=r.v[k];let y=null;if(basis==='ly'){if(k==='tc'&&r.v.samePrior!=null){const d=r.v.sameTc/r.v.samePrior-1;return`<span class="delta ${d>=0?'up':'down'}" title="同店 vs 去年">${d>=0?'▲':'▼'}${Math.abs(d*100).toFixed(1)}%</span>`;}return'<span class="delta flat" title="去年同期無此指標">—</span>';}
 y=r.prev?.[k];if(x==null||y==null)return'<span class="delta flat" title="比較資料不足">—</span>';const d=k==='tc'?x/y-1:x-y,good=m.hi?d>0:d<0,ar=d>0?'▲':d<0?'▼':'＝';
 const txt=k==='tc'?Math.abs(d*100).toFixed(1)+'%':m.pt?Math.abs(d*100).toFixed(1)+'%':Math.abs(d).toFixed(2);return`<span class="delta ${Math.abs(d)<1e-4?'flat':good?'up':'down'}" title="vs 上期">${ar}${txt}</span>`;}
const dv=a=>a==null?'':a>=1.10?'var(--dv-b3)':a>=1.04?'var(--dv-b2)':a>=1.01?'var(--dv-b1)':a>=.99?'var(--dv-n)':a>=.96?'var(--dv-r1)':a>=.90?'var(--dv-r2)':'var(--dv-r3)';
const ink=a=>a!=null&&(a>=1.10||a<.90)?'#fff':'var(--text)';
const ach=(k,r,x=r.v[k])=>{if(x==null)return null;const t=r.t[k];return MK[k].cap?t/x:x/t;};
const gapPt=r=>r.v.sstg==null?null:(r.v.sstg-r.t.sstg)*100;
const dvGap=g=>g==null?'':g>=1?'var(--dv-b3)':g>=.5?'var(--dv-b2)':g>=.1?'var(--dv-b1)':g>-.1?'var(--dv-n)':g>-.5?'var(--dv-r1)':g>-1?'var(--dv-r2)':'var(--dv-r3)';
const tip=$('tip');const showTip=(e,h)=>{tip.innerHTML=h;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-200)+'px';tip.style.top=(e.clientY+14)+'px';};const hideTip=()=>tip.style.display='none';
function needOf(k,r){const v=r.v,t=r.t;if(k==='d7'||k==='d25'){const y=v['y'+k.slice(1)],n=v['v'+k.slice(1)];return y==null||!n?null:Math.ceil(t[k]*n-y-1e-9);}if(k==='fa'&&v.tc)return Math.ceil(v.faN-t.fa*v.tc-1e-9);return null;}
function gapOf(k,r){const v=r.v,t=r.t;if(k==='d7'||k==='d25'){const n=needOf(k,r);return n>0?'差 '+n+' 單':null;}
 if(k==='tplh'&&v.nonfa!=null&&v.tplh){const h=Math.round(v.nonfa/v.tplh-v.nonfa/t.tplh);return h>0?'多 '+h+' 工時':null;}
 if(k==='sstg'&&v.samePrior){const n=Math.ceil(v.samePrior*(1+t.sstg)-v.sameTc);return n>0?'差 '+n+' 單':null;}
 if(k==='fa'&&v.tc){const n=needOf(k,r);return n>0?'需轉自送 '+n+' 單':null;}return null;}
function events(){const E=[];for(const r of ok()){for(const m of M.filter(m=>!m.noTarget)){const s=status(m.k,r);if(s==='bad')E.push({sev:(m.k==='sstg'||Math.abs(ach(m.k,r)-1)<.04)?'serious':'critical',r,k:m.l,what:`本期 ${m.f(r.v[m.k])}（${tgtTxt(m.k,r)}）`,gap:gapOf(m.k,r)});}
  if(r.b.gap)E.push({sev:'serious',r,k:'資料',what:`成績缺 ${r.b.gap} 天：${(r.cov.scores?.missing_dates||[]).map(md).join('、')}`,gap:null});
  if(r.v.sstg==null&&r.v.tc!=null)E.push({sev:'warning',r,k:'SSTG',what:'去年同期資料不足，無法計算',gap:null});}
 for(const r of R.filter(r=>r.err))E.push({sev:'critical',r,k:'連線',what:'讀取失敗：'+r.err,gap:null});
 const o={critical:0,serious:1,warning:2};return E.sort((a,b)=>o[a.sev]-o[b.sev]);}
// ===== 總覽 =====
function hero(){const rs=ok(),tot=rs.reduce((s,r)=>s+(r.v.tc||0),0),sameT=rs.reduce((s,r)=>s+(r.v.sameTc||0),0),allPrior=rs.every(r=>r.v.samePrior!=null),prior=rs.reduce((s,r)=>s+(r.v.samePrior||0),0),miss=rs.filter(r=>r.v.samePrior==null).map(r=>r.id);
 const ss=allPrior&&prior>0&&rs.length===CENTERS.length?sameT/prior-1:null,E=events(),gaps=rs.reduce((n,r)=>n+(r.b.gap||0),0);
 $('hero').innerHTML=`<div class="kpi"><span>總 TC</span><b>${tot.toLocaleString('en-US')}</b><em>${rs.length}／${CENTERS.length} 區合計</em></div>
 <div class="kpi ${ss==null?'na':ss>=DEFAULT_T.sstg?'ok':'bad'}"><span>總 SSTG</span><b>${ss==null?'資料不足':MK.sstg.f(ss)}</b><em>${ss==null?'缺 '+(miss.join('、')||'—')+' 去年 TC':'同店比較'}</em></div>
 <div class="kpi ${E.length?'bad':'ok'}" style="cursor:pointer" onclick="switchTab('alert')"><span>待處理預警</span><b>${E.length} 項</b><em>${['critical','serious','warning'].map(v=>{const n=E.filter(e=>e.sev===v).length;return n?{critical:'嚴重',serious:'注意',warning:'觀察'}[v]+' '+n:''}).filter(Boolean).join('、')||'無'}</em></div>
 <div class="kpi ${gaps?'warn':'ok'}" style="cursor:pointer" onclick="document.getElementById('dqCard').scrollIntoView({behavior:'smooth',block:'center'})"><span>成績缺日</span><b>${gaps} 天</b><em>${rs.filter(r=>!r.b.gap).length}／${rs.length} 區完整</em></div>`;}
function lights(){const ks=M.filter(m=>!m.noTarget);
 $('lights').innerHTML=OFF.map(o=>`<div class="lg off"><h3>${o.id} ${o.name}</h3><div class="dots">${ks.map(m=>`<span class="lt"><i></i>${m.l.replace(' 佔比','')}</span>`).join('')}</div><b>尚未接上</b></div>`).join('')+
 R.map(r=>{if(r.err)return`<div class="lg" style="--rc:var(--bad)"><h3>${rn(r)}</h3><b class="bad">讀取失敗</b><small class="lgs">${r.err.slice(0,40)}</small></div>`;
  const st=ks.map(m=>status(m.k,r)),okn=st.filter(x=>x==='ok').length,n=st.filter(x=>x!=='na').length;
  return`<div class="lg" data-id="${r.id}" style="--rc:var(${r.c})"><h3>${rn(r)}</h3><div class="dots">${ks.map((m,i)=>`<span class="lt ${st[i]}" title="${m.l}：${r.v[m.k]==null?'資料不足':m.f(r.v[m.k])}（${tgtTxt(m.k,r)}）"><i>${st[i]==='ok'?'✓':st[i]==='bad'?'✕':'－'}</i>${m.l.replace(' 佔比','')}</span>`).join('')}</div><b class="${okn===n?'ok':'bad'}">${okn}／${n} 達標</b><small class="lgs">${n<ks.length?(ks.length-n)+' 項資料不足':'資料到 '+md(r.upd)}</small></div>`}).join('');
 $('lights').querySelectorAll('.lg[data-id]').forEach(t=>t.onclick=()=>{deepId=t.dataset.id;switchTab('deep');});}
function cards(){$('rcs').innerHTML=R.map(r=>{if(r.err)return`<div class="rc err" style="--rc:var(--bad)"><h3>${rn(r)}</h3><div class="errmsg">讀取失敗：${r.err}</div></div>`;
 const B=[['異常日',r.b.ano,'天',r.b.ano>=2],['等餐',r.b.wait,'筆',r.b.wait>=50],['劃線缺漏',r.b.sig,'筆',r.b.sig>=5],['成績缺日',r.b.gap,'天',r.b.gap>0]];
 return`<div class="rc" style="--rc:var(${r.c})" data-deep="${r.id}"><h3>${rn(r)}<small>資料到 ${md(r.upd)}</small></h3>
 <div class="mhead"><span></span><span>本期</span><span>目標</span><span>vs ${basis==='ly'?'去年同期':'上期'}</span></div>
 ${M.map(m=>{const x=r.v[m.k],s=status(m.k,r),f=RK[m.k][r.id];return`<div class="mrow"><span class="l">${m.l}</span><span class="v ${x==null?'na':s}">${x==null?'資料不足':m.f(x)}${f==='best'?'<i class="fb">▲</i>':f==='worst'?'<i class="fw">▼</i>':''}</span><span class="tg">${m.noTarget?'—':m.f(r.t[m.k])}</span><span class="dl">${delta(m.k,r)}</span></div>`}).join('')}
 <div class="bstat">${B.map(([l,v,u,bad])=>`<div class="${bad?'bad':''}"><span>${l}</span><b>${v==null?'—':v}${v!=null?'<small> '+u+'</small>':''}</b></div>`).join('')}</div></div>`}).join('');
 $('rcs').querySelectorAll('[data-deep]').forEach(a=>a.onclick=()=>{deepId=a.dataset.deep;switchTab('deep');});}
function insight(){const E=events().slice(0,4),best=R.filter(r=>RK.sstg?.[r.id]==='best');

 $('alertTable').innerHTML=`<thead><tr><th>嚴重度</th><th>區域｜指標</th><th>狀況</th><th>缺口</th></tr></thead><tbody>${E.map(a=>`<tr><td><span class="sev ${a.sev}">${SI[a.sev]} ${SL[a.sev]}</span></td><td style="white-space:nowrap"><span class="dot" style="background:var(${a.r.c})"></span>${rn(a.r)}｜${a.k}</td><td>${a.what}</td><td class="gap">${a.gap||'—'}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center">目前沒有預警</td></tr>'}</tbody>`;
 $('eff').innerHTML=`<thead><tr><th>區域</th><th>本期行動項目</th><th>未封存</th><th>已封存</th></tr></thead><tbody>${ok().map(r=>`<tr><td><span class="dot" style="background:var(${r.c})"></span>${rn(r)}</td><td>${r.actions.total??'—'}</td><td>${r.actions.unarchived??'—'}</td><td>${r.actions.archived??'—'}</td></tr>`).join('')}</tbody>`;
 const p=window.__period||period(),rs=ok(),tot=rs.reduce((s,r)=>s+(r.v.tc||0),0);
 $('report').textContent=`【外送事業部 全區週報｜${md(p.start)}–${md(p.useEnd||p.end)}】
一、總 TC ${tot.toLocaleString('en-US')}（${rs.length} 區合計）。
二、需處理：
${E.filter(e=>e.sev!=='warning').map((e,i)=>`　${i+1}. ${rn(e.r)} ${e.k}：${e.what}${e.gap?'（'+e.gap+'）':''}`).join('\n')||'　無'}
三、資料：${rs.filter(r=>r.b.gap).map(r=>rn(r)+' 成績缺 '+r.b.gap+' 天').join('；')||'各區成績完整'}；994、997 尚未接上。
（原因與責任需再核對訂單與排班紀錄。）`;}
// ===== 切換與登入 =====
function render(){$('dimbar').innerHTML=dimSeg(null);renderMx();renderWhy();renderCards();if($('p-cmp').classList.contains('on'))cmpView();if($('p-deep').classList.contains('on'))deep();alertsView();}
function switchTab(t){$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));render();scrollTo(0,0);}
window.switchTab=switchTab;
$('tabs').onclick=e=>{const t=e.target.closest('button')?.dataset.t;if(t)switchTab(t);};
$('cmpMetric').onclick=e=>{const k=e.target.dataset.k;if(k){cmpK=k;cmpView();}};
$('cmpView').onclick=e=>{const v=e.target.dataset.v;if(!v)return;$('cmpView').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));document.querySelectorAll('.vw').forEach(x=>x.classList.toggle('on',x.id==='vw-'+v));$('matrixCard').style.display=v==='tr'?'none':'';if(v==='tr')trend();};
const segOn=(id,attr,val)=>$(id).querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset[attr]===val));
$('unit').onclick=e=>{const u=e.target.dataset.u;if(!u)return;unit=u;if(u==='day'&&sel?.endsWith('|sssg'))sel=null;anchor=tz();segOn('unit','u',u);load();};
$('prev').onclick=()=>{shift(-1);load();};$('next').onclick=()=>{shift(1);load();};$('today').onclick=()=>{anchor=tz();load();};
$('cut').onclick=e=>{const c=e.target.dataset.c;if(!c)return;cutoff=c;segOn('cut','c',c);load();};
$('basis').onclick=e=>{const b=e.target.dataset.b;if(!b)return;basis=b;segOn('basis','b',b);load();};
$('reload').onclick=()=>load();
document.addEventListener('click',e=>{const b=e.target.closest('[data-dim]');if(!b)return;e.stopPropagation();dim=b.dataset.dim;$('dimbar').innerHTML=dimSeg(null);renderWhy();renderCards();},true);
// ===== 匯出：使用同一份畫面快照；PNG 與 XLSX 均不需另載入套件 =====
function exportEnabled(){for(const id of ['exPng','exXlsx'])$(id).disabled=loading||!R.length;}
const fname=(view,ext)=>`全區總覽_${view.start}_${view.end}.${ext}`;
function overviewData(){if(loading||R.length!==CENTERS.length)throw new Error('資料讀取中');const p=window.__period,cols=COLS.filter(c=>!(c.k==='sssg'&&unit==='day'));
 return{start:p.start,end:p.useEnd||p.end,label:$('periodLabel').textContent,basis:basis==='prev'?'前期變化':'目標差距',dimension:DIMS[dim],cols,
  matrix:R.map(r=>({name:rn(r),date:r.upd||'資料不足',error:!!r.err,cells:cols.map(c=>mcell(r,c.k))})),cards:R.map(problemCard),regions:R};}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
async function busy(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='匯出中…';try{await fn(overviewData());}catch(e){alert('匯出失敗：'+(e.message||e));}finally{btn.textContent=t;exportEnabled();}}
function pngCanvas(view){const cv=document.createElement('canvas'),W=1600,pad=32,gap=20,cardW=(W-2*pad-3*gap)/4;
 const style=getComputedStyle(document.documentElement),color=n=>style.getPropertyValue(n).trim(),bg=color('--bg')||'#f6f5f2',card=color('--card')||'#ffffff',text=color('--text')||'#252525',bad=color('--bad')||'#c92c2c',good=color('--ok')||'#228541',line=color('--line')||'#dedbd5';
 const ctx=cv.getContext('2d');ctx.font='800 17px "Microsoft JhengHei",sans-serif';
 const wrap=(value,width)=>{const out=[];let row='';for(const ch of String(value)){if(row&&ctx.measureText(row+ch).width>width){out.push(row);row=ch;}else row+=ch;}if(row)out.push(row);return out;};
 const linesFor=row=>[row.name,row.eff,row.txt,row.detail].filter(Boolean).flatMap(x=>wrap(x,cardW-32));
 const heights=view.cards.map(c=>125+c.rows.reduce((n,row)=>n+linesFor(row).length*25+20,0)),cardH=Math.max(180,...heights),matrixY=115,matrixH=60+view.matrix.length*70,cardsY=matrixY+matrixH+75,H=cardsY+cardH+pad;
 cv.width=W*2;cv.height=H*2;ctx.scale(2,2);ctx.textAlign='center';ctx.textBaseline='middle';
 const rect=(x,y,w,h,fill)=>{ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);};
 const txt=(value,x,y,size=19,fill=text)=>{ctx.font=`800 ${size}px "Microsoft JhengHei",sans-serif`;ctx.fillStyle=fill;ctx.fillText(value,x,y);};
 rect(0,0,W,H,bg);txt('全區總覽　'+view.label,W/2,35,28);txt(`${view.start}–${view.end}　${view.basis}　${view.dimension}`,W/2,78,18);
 rect(pad,matrixY,W-2*pad,matrixH,card);const first=180,cw=(W-2*pad-first)/view.cols.length;
 view.cols.forEach((c,i)=>txt(c.l,pad+first+(i+.5)*cw,matrixY+30,19));
 view.matrix.forEach((row,j)=>{const y=matrixY+60+j*70;rect(pad,y,W-2*pad,1,line);txt(row.name,pad+first/2,y+35,20);
  row.cells.forEach((cell,i)=>txt(row.error?'讀取失敗':cell.val,pad+first+(i+.5)*cw,y+35,row.error||cell.st==='na'?17:24,cell.st==='bad'?bad:cell.st==='ok'?good:text));});
 txt('本期最需要處理',W/2,cardsY-35,23);
 view.cards.forEach((c,i)=>{const x=pad+i*(cardW+gap),cx=x+cardW/2;rect(x,cardsY,cardW,cardH,card);rect(x,cardsY,cardW,4,color(c.r.c)||bad);txt(cardTitle(c),cx,cardsY+30,17);txt(c.value,cx,cardsY+70,28,c.k?bad:text);txt(c.gap,cx,cardsY+105,17,bad);let y=cardsY+135;
  for(const row of c.rows){rect(x+16,y-10,cardW-32,1,line);ctx.font='800 17px "Microsoft JhengHei",sans-serif';for(const value of linesFor(row)){txt(value,cx,y,17,row.missing?text:row.eff===value?good:text);y+=25;}y+=20;}});
 return cv;}
$('exPng').onclick=()=>busy($('exPng'),async view=>{await document.fonts?.ready;const cv=pngCanvas(view);const blob=await new Promise((resolve,reject)=>cv.toBlob(x=>x?resolve(x):reject(new Error('PNG 產生失敗')),'image/png'));download(blob,fname(view,'png'));});
function excelSheets(view){const A=[['期間',view.label,'起日',view.start,'截止',view.end,'比較',view.basis],[],['區域','資料到',...view.cols.map(c=>c.l)]];
 for(const row of view.matrix)A.push([row.name,row.date,...row.cells.map(x=>row.error?'讀取失敗':x.val)]);
 const B=[['期間',view.start,view.end,'比較',view.basis],[],['區域','資料到','指標','分組','本期','缺口','項目','影響','單數／工時','改善單數／工時']];
 for(const c of view.cards){const prefix=[rn(c.r),c.r.upd||'資料不足',c.k?MK[c.k].l:'',c.dimension||'',c.value,c.gap];if(!c.rows.length)B.push(prefix);else for(const row of c.rows)B.push([...prefix,row.name,row.eff,row.txt,row.detail]);}
 const C=[['區域','資料到','指標','分組','項目','影響','單數／工時','改善單數／工時']];
 for(const r of view.regions.filter(r=>!r.err))for(const [k,dims] of Object.entries(DIM_OF))for(const d of dims)for(const row of driverRows(k,r,d))C.push([rn(r),r.upd||'資料不足',MK[k].l,DIMS[d],row.name,row.eff,row.txt,row.detail]);
 const keys=['tc','fa','y7','n7','y25','n25','nonfa','hours','current','prior','sstg','tplh'],D=[['區域','分組','項目',...keys,'完整']];
 for(const r of view.regions.filter(r=>!r.err))for(const [key,d] of [['stores','store'],['areas','area'],['acs','ac'],['slots','slot'],['store_sstg','store'],['area_tplh','area']])for(const x of r.s[key]||[])D.push([rn(r),key,groupName(d,x),...keys.map(k=>number(x[k])??'資料不足'),x.complete==null?'':x.complete?'是':'資料不足']);
 return[{name:'四區成績',rows:A},{name:'四張問題卡',rows:B},{name:'拉低前三',rows:C},{name:'彙總數字',rows:D}];}
// Minimal OOXML writer: inline strings prevent formula execution; ZIP entries are stored without compression.
function xlsxBlob(sheets){const enc=new TextEncoder(),xml=x=>String(x??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
 const header='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main',rel='http://schemas.openxmlformats.org/package/2006/relationships';
 const column=n=>{let r='';for(n++;n;n=Math.floor((n-1)/26))r=String.fromCharCode(65+(n-1)%26)+r;return r;};
 const files=[['[Content_Types].xml',header+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
 ['_rels/.rels',header+`<Relationships xmlns="${rel}"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
 ['xl/workbook.xml',header+`<workbook xmlns="${ns}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xml(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
 ['xl/_rels/workbook.xml.rels',header+`<Relationships xmlns="${rel}">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="styles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
 ['xl/styles.xml',header+`<styleSheet xmlns="${ns}"><fonts count="1"><font><b/><sz val="12"/><name val="Microsoft JhengHei"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="1"><xf fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`]];
 sheets.forEach((s,i)=>files.push([`xl/worksheets/sheet${i+1}.xml`,header+`<worksheet xmlns="${ns}"><sheetFormatPr defaultRowHeight="24"/><cols><col min="1" max="${Math.max(...s.rows.map(r=>r.length))}" width="24" customWidth="1"/></cols><sheetData>${s.rows.map((row,j)=>`<row r="${j+1}">${row.map((x,k)=>{const ref=column(k)+(j+1);return typeof x==='number'&&Number.isFinite(x)?`<c r="${ref}"><v>${x}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xml(x)}</t></is></c>`;}).join('')}</row>`).join('')}</sheetData></worksheet>`]));
 const crcTable=Array.from({length:256},(_,n)=>{for(let j=0;j<8;j++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0;}),crc=bytes=>{let n=0xffffffff;for(const b of bytes)n=crcTable[(n^b)&255]^(n>>>8);return(n^0xffffffff)>>>0;};
 const parts=[],central=[];let offset=0;const block=n=>{const a=new Uint8Array(n);return[a,new DataView(a.buffer)];};
 for(const [name,value] of files){const path=enc.encode(name),data=enc.encode(value),sum=crc(data),[h,v]=block(30+path.length);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,33,true);v.setUint32(14,sum,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,path.length,true);h.set(path,30);parts.push(h,data);
  const [c,w]=block(46+path.length);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x800,true);w.setUint16(14,33,true);w.setUint32(16,sum,true);w.setUint32(20,data.length,true);w.setUint32(24,data.length,true);w.setUint16(28,path.length,true);w.setUint32(42,offset,true);c.set(path,46);central.push(c);offset+=h.length+data.length;}
 const size=central.reduce((n,x)=>n+x.length,0),[end,v]=block(22);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);
 return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
$('exXlsx').onclick=()=>busy($('exXlsx'),view=>download(xlsxBlob(excelSheets(view)),fname(view,'xlsx')));
$('copyReport').onclick=()=>navigator.clipboard?.writeText($('report').textContent);
$('sideNav').insertAdjacentHTML('beforeend',CENTERS.map(c=>`<a href="https://uli20000.github.io/T${c.id}/analysis.html" target="_blank" rel="noopener"><span class="dot" style="background:var(${c.c})"></span>${c.id} ${c.name}</a>`).join('')+OFF.map(o=>`<a class="dim">⚪ ${o.id} ${o.name}（未接上）</a>`).join('')+'<a href="#" id="logout">🚪 登出</a>');
$('logout').onclick=async e=>{e.preventDefault();await Promise.all(CENTERS.map(c=>clients[c.id].auth.signOut().catch(()=>{})));location.reload();};
async function signedIn(){const ss=await Promise.all(CENTERS.map(c=>clients[c.id].auth.getSession().then(r=>r.data.session)));return ss.every(Boolean)?ss[0].user.email:null;}
$('loginForm').onsubmit=async e=>{e.preventDefault();const em=$('em').value.trim(),pw=$('pw').value;$('loginMsg').textContent='登入中…';
 const res=await Promise.all(CENTERS.map(c=>clients[c.id].auth.signInWithPassword({email:em,password:pw}).then(r=>({c,err:r.error?.message})).catch(x=>({c,err:x.message}))));
 $('pw').value='';const bad=res.filter(r=>r.err);if(bad.length===CENTERS.length){$('loginMsg').textContent='登入失敗：'+bad[0].err;return;}
 if(bad.length)alert('以下區域登入失敗，畫面會顯示讀取失敗：'+bad.map(b=>b.c.id+'（'+b.err+'）').join('、'));start(em);};
function start(em){$('login').style.display='none';$('userBox').textContent=em+' ▾';load();}
if(LOCAL_PREVIEW)start('本機預覽');else signedIn().then(em=>{if(em)start(em);});
