<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e8"><title>KFC｜等餐原因回覆</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#c8102e;--ink:#242424;--muted:#77736d;--paper:#fff;--bg:#f4f0e8;--line:#ddd8ce;--green:#356b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",Arial,sans-serif}.page{max-width:760px;margin:auto;padding:20px 14px 50px}.header,.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px}.brand{font-size:12px;letter-spacing:3px;color:var(--muted)}h1{font-size:25px;margin:8px 0}.sub{color:var(--muted);line-height:1.6}.order{padding:16px 0;border-bottom:1px solid var(--line)}.order:last-child{border:0}.order-head{display:flex;gap:10px;justify-content:space-between;font-weight:800}.order-date{color:var(--muted);font-size:14px}.order-no{font-size:17px}.order label{display:block;margin-top:10px;font-weight:700}.order textarea{width:100%;min-height:84px;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;resize:vertical}.batch{display:grid;gap:8px;padding:14px;background:#f8f6f1;border-radius:14px;margin-bottom:14px}.batch label{font-weight:700}.batch textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}.batch button,.submit{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--ink);color:white;font:inherit;font-weight:800;cursor:pointer}.submit{background:var(--red);min-height:54px;font-size:17px;margin-top:14px}.submit:disabled{opacity:.55}.msg{padding:14px;text-align:center;color:var(--muted);line-height:1.6}.success{color:var(--green);font-weight:800}.check{width:22px;height:22px;vertical-align:middle;margin-right:6px}
</style></head><body><main class="page">
<header class="header"><div class="brand">KFC DELIVERY CENTER</div><h1>等餐原因回覆</h1><div id="restaurant" class="sub">載入餐廳資料中…</div></header>
<section class="card"><div id="message" class="msg">載入待回覆訂單中…</div><div id="replyForm" hidden>
<div class="batch"><label for="batchReason">同一原因套用至勾選訂單</label><textarea id="batchReason" maxlength="500" placeholder="輸入共同原因"></textarea><button id="applyBatch" type="button">套用到勾選訂單</button></div>
<div id="orders"></div><button id="submit" class="submit" type="button">送出已填原因</button>
</div></section>
</main><script>
const SUPABASE_URL="https://nurnboqwhctyswcufkyk.supabase.co";
const SUPABASE_KEY="sb_publishable_YieSqh1zXq8wIvQiO9B_wg_ZbDkne7G";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const token=new URLSearchParams(location.search).get("token")||"";
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let current=[];
async function load(){
 $("replyForm").hidden=true;$("orders").replaceChildren();
 if(!token){$("message").textContent="連結缺少識別碼，請向值班人員索取共用回覆連結。";return;}
 try{const r=await db.rpc("t995_public_list_shared_delay_orders",{p_token:token});if(r.error)throw r.error;const d=r.data||{};current=d.orders||[];$("restaurant").textContent=(d.restaurant_name||"餐廳")+"｜"+(d.month||"")+" 待回覆訂單："+current.length;
 if(!current.length){$("message").innerHTML='<span class="success">本月目前沒有待回覆訂單。</span>';return;}
 $("message").textContent="請逐筆填寫原因；可先勾選多筆訂單，再套用相同原因。完成送出後，訂單會從清單移除。";
 $("orders").innerHTML=current.map(o=>'<article class="order" data-id="'+esc(o.id)+'"><div class="order-head"><label><input class="check" type="checkbox" aria-label="選取訂單 '+esc(o.order_number)+'"><span class="order-date">'+esc(o.record_date)+'</span></label><span class="order-no">'+esc(o.restaurant_name)+'｜訂單 '+esc(o.order_number)+'</span></div><label>等餐原因<textarea class="reason" maxlength="500" placeholder="請說明這筆訂單等餐原因"></textarea></label></article>').join("");
 $("replyForm").hidden=false;
 }catch(e){$("message").textContent="無法載入回覆資料："+(e.message||"連結可能已失效，請聯絡值班人員");}
}
$("applyBatch").onclick=()=>{const reason=$("batchReason").value.trim();if(!reason){$("message").textContent="請先輸入要套用的共同原因。";return;}const selected=[...document.querySelectorAll(".order")].filter(row=>row.querySelector(".check").checked);selected.forEach(row=>row.querySelector(".reason").value=reason);$("message").textContent="共同原因已套用到 "+selected.length+" 筆訂單。";};
$("submit").onclick=async()=>{const rows=[...document.querySelectorAll(".order")],updates=rows.map(row=>({id:row.dataset.id,reason:row.querySelector(".reason").value.trim()})).filter(x=>x.reason);if(!updates.length){$("message").textContent="請至少填寫一筆等餐原因。";return;}if(!confirm("送出 "+updates.length+" 筆回覆？送出後，完成的訂單會從此清單移除。"))return;
 $("submit").disabled=true;$("message").textContent="送出中…";try{const r=await db.rpc("t995_public_submit_shared_delay_reasons",{p_token:token,p_updates:updates});if(r.error)throw r.error;current=r.data?.orders||[];await load();if(current.length)$("message").innerHTML='<span class="success">已送出回覆，仍有 '+current.length+' 筆待回覆。</span>';else $("message").innerHTML='<span class="success">謝謝，所有待回覆訂單都已完成。</span>';}catch(e){$("message").textContent="送出失敗："+(e.message||"請重新整理後再試");}finally{$("submit").disabled=false;}
};
load();
</script></body></html>
