<!doctype html><html lang="zh-Hant"><head><script src="center-config.js"></script><script src="center-runtime.js"></script><link rel="stylesheet" href="shared-shell.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://vsezvxjuwwprvjxoeavl.supabase.co; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>TEST-T995 設備與回覆測試</title><style>body{font:16px system-ui;margin:24px auto;padding:0 16px;max-width:600px}input,button{font:inherit;padding:10px;box-sizing:border-box;width:100%;margin:6px 0}pre{white-space:pre-wrap;background:#eef3f8;padding:16px}small{display:block;line-height:1.6}</style></head><body><h1>TEST-T995 設備與回覆測試</h1><p>僅連接新測試專案，不連995正式系統。僅管理合成測試資料：設備異常勾選結案、餐廳回覆退回補充。</p><small>請自行輸入測試帳號密碼。此頁不使用第三方腳本、不儲存密碼或登入token；重新整理後需重新登入。關閉頁面不等於撤銷伺服器session，離開前請按登出。</small><form id="form"><label>測試Email<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button id="login">登入測試台</button></form><button id="logout" disabled>登出本次測試</button><pre id="result" role="status">尚未登入。此頁只開放設備／回覆功能，其餘功能仍在接線。</pre><section id="panel" hidden><button id="refresh">重新載入</button><h2>設備異常</h2><p>勾選要結案的項目，未選項目不變。</p><div id="issues"></div><button id="resolve">結案勾選項目</button><h2>餐廳已完成回覆</h2><div id="replies"></div><h2>退回紀錄</h2><div id="history"></div></section><script>
'use strict';
const BASE='https://vsezvxjuwwprvjxoeavl.supabase.co',KEY='sb_publishable_eqhr9HvISO5BBp-Cx-T2Jw_HAAf0hfC';let access=null;
const $=id=>document.getElementById(id);const show=s=>$('result').textContent=s;
async function api(path,options={},profile=false){const res=await fetch(BASE+path,{...options,headers:{apikey:KEY,...(access?{Authorization:'Bearer '+access}:{}),...(profile?{'Accept-Profile':'shared_test_995'}:{}),...(options.headers||{})},cache:'no-store'});const raw=await res.text();let data;try{data=raw?JSON.parse(raw):{};}catch{data={};}if(!res.ok)throw new Error('請求失敗 '+res.status+' '+(data.code||data.error_code||'請確認帳號及權限'));return data;}
$('form').addEventListener('submit',async event=>{event.preventDefault();if(access)return show('請先登出目前session。');$('login').disabled=true;show('正在登入新測試專案…');const password=$('password').value;$('password').value='';try{const session=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password})});access=session.access_token;if(!access)throw new Error('未取得登入session');$('logout').disabled=false;const admin=await api('/rest/v1/admin_identities?select=user_id,active',{},true);if(admin.length!==1||admin[0].active!==true)throw new Error('此帳號沒有啟用的測試管理資格');const devices=await api('/rest/v1/recorders?select=id&limit=100',{},true);show('登入成功，僅操作合成測試資料。');await loadPanel();}catch(error){show(error.message+(access?'\n已登入但驗收未通過；請登出。':''));}finally{$('login').disabled=!!access;}});
$('logout').addEventListener('click',async()=>{try{await api('/auth/v1/logout?scope=local',{method:'POST'});access=null;$('panel').hidden=true;for(const id of ['issues','replies','history'])$(id).replaceChildren();$('logout').disabled=true;$('login').disabled=false;show('已登出本次測試。');}catch(error){show('登出未確認成功，請重試。'+error.message);}});

let busy=false;let selected=new Set();
const node=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
const rpc=(name,args)=>api('/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','Content-Profile':'shared_test_995'},body:JSON.stringify(args)},true);
async function loadPanel(){
 const [issues,devices,replies,history]=await Promise.all([
 api('/rest/v1/recorder_issue_reports?select=id,recorder_number,issue_description,resolution_status&resolution_status=neq.resolved&order=reported_at.asc&limit=100',{},true),
 api('/rest/v1/recorders?select=recorder_number,health_status&limit=100',{},true),
 api('/rest/v1/t995_delay_orders?select=id,restaurant_name,order_number,reason,responded_at&status=eq.completed&order=record_date.desc&limit=100',{},true),
 api('/rest/v1/delay_reply_revisions?select=delay_order_id,revision_no,prior_reason,return_reason&order=returned_at.desc&limit=100',{},true)]);
 selected.clear();for(const id of ['issues','replies','history'])$(id).replaceChildren();
 for(const item of issues){const label=node('label');const input=node('input');input.type='checkbox';input.style.width='auto';input.addEventListener('change',()=>input.checked?selected.add(item.id):selected.delete(item.id));label.append(input,node('span',item.recorder_number+'：'+item.issue_description+'（'+item.resolution_status+'）'));$('issues').append(label,node('br'));}
 if(!issues.length)$('issues').append(node('p','目前沒有未結案設備異常。'));
 for(const d of devices)$('issues').append(node('small',d.recorder_number+' 設備狀態：'+d.health_status));
 for(const item of replies){const card=node('div');card.append(node('p',item.restaurant_name+'／'+item.order_number+'：'+item.reason));const reason=node('textarea');reason.placeholder='退回原因（必填，最多500字）';reason.maxLength=500;reason.rows=3;reason.style.width='100%';const button=node('button','退回此筆補充');button.addEventListener('click',async()=>{if(busy)return;const value=reason.value.trim();if(!value)return show('請先填寫退回原因。');if(!confirm('將此合成測試回覆退回補充？舊回覆會保留在歷史。'))return;busy=true;button.disabled=true;try{await rpc('return_delay_reply',{p_order_id:item.id,p_expected_responded_at:item.responded_at,p_return_reason:value});await loadPanel();show('已退回補充，原回覆已保留。');}catch(e){show(e.message+'；請重新載入核對，勿假定成功。');}finally{busy=false;button.disabled=false;}});card.append(reason,button);$('replies').append(card);}
 if(!replies.length)$('replies').append(node('p','目前沒有可退回的已完成回覆。'));
 for(const h of history)$('history').append(node('p','第'+h.revision_no+'版原回覆：'+h.prior_reason+'；退回原因：'+h.return_reason));
 if(!history.length)$('history').append(node('p','尚無退回紀錄。'));$('panel').hidden=false;
}
$('refresh').addEventListener('click',async()=>{if(busy)return;try{await loadPanel();show('資料已重新載入。');}catch(e){show(e.message);}});
$('resolve').addEventListener('click',async()=>{if(busy)return;const ids=[...selected];if(!ids.length)return show('請先勾選要結案的異常。');if(!confirm('將勾選的 '+ids.length+' 筆合成異常標為修復結案？'))return;busy=true;$('resolve').disabled=true;try{await rpc('resolve_recorder_cases',{p_ids:ids,p_action:'repaired'});await loadPanel();show('已結案 '+ids.length+' 筆；未選項目維持原狀。');}catch(e){show(e.message+'；請重新載入核對。');}finally{busy=false;$('resolve').disabled=false;}});
</script></body></html>
