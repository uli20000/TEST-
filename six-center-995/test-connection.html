<!doctype html><html lang="zh-Hant"><head><script src="center-config.js"></script><script src="center-runtime.js"></script><link rel="stylesheet" href="shared-shell.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://vsezvxjuwwprvjxoeavl.supabase.co; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>TEST-T995 連線驗收</title><style>body{font:16px system-ui;margin:24px auto;padding:0 16px;max-width:600px}input,button{font:inherit;padding:10px;box-sizing:border-box;width:100%;margin:6px 0}pre{white-space:pre-wrap;background:#eef3f8;padding:16px}small{display:block;line-height:1.6}</style></head><body><h1>TEST-T995 連線驗收</h1><p>僅連接新測試專案，不連995正式系統。此頁只讀取你的測試管理員資格及設備筆數，不修改資料。</p><small>請自行輸入測試帳號密碼。此頁不使用第三方腳本、不儲存密碼或登入token；重新整理後需重新登入。關閉頁面不等於撤銷伺服器session，離開前請按登出。</small><form id="form"><label>測試Email<input id="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" type="password" autocomplete="current-password" required></label><button id="login">登入並唯讀驗收</button></form><button id="logout" disabled>登出本次測試</button><pre id="result" role="status">尚未登入。此頁僅作連線診斷，不代表完整系統驗收完成。</pre><script>
'use strict';
const BASE='https://vsezvxjuwwprvjxoeavl.supabase.co',KEY='sb_publishable_eqhr9HvISO5BBp-Cx-T2Jw_HAAf0hfC';let access=null;
const $=id=>document.getElementById(id);const show=s=>$('result').textContent=s;
async function api(path,options={},profile=false){const res=await fetch(BASE+path,{...options,headers:{apikey:KEY,...(access?{Authorization:'Bearer '+access}:{}),...(profile?{'Accept-Profile':'shared_test_995'}:{}),...(options.headers||{})},cache:'no-store'});const raw=await res.text();let data;try{data=raw?JSON.parse(raw):{};}catch{data={};}if(!res.ok)throw new Error('請求失敗 '+res.status+' '+(data.code||data.error_code||'請確認帳號及權限'));return data;}
$('form').addEventListener('submit',async event=>{event.preventDefault();if(access)return show('請先登出目前session。');$('login').disabled=true;show('正在登入新測試專案…');const password=$('password').value;$('password').value='';try{const session=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password})});access=session.access_token;if(!access)throw new Error('未取得登入session');$('logout').disabled=false;const admin=await api('/rest/v1/admin_identities?select=user_id,active',{},true);if(admin.length!==1||admin[0].active!==true)throw new Error('此帳號沒有啟用的測試管理資格');const devices=await api('/rest/v1/recorders?select=id&limit=100',{},true);show('登入成功，測試管理資格有效。\n已讀取設備 '+devices.length+' 筆（最多顯示100筆）。\n未修改任何資料。此結果不代表全功能已完成。');}catch(error){show(error.message+(access?'\n已登入但驗收未通過；請登出。':''));}finally{$('login').disabled=!!access;}});
$('logout').addEventListener('click',async()=>{try{await api('/auth/v1/logout?scope=local',{method:'POST'});access=null;$('logout').disabled=true;$('login').disabled=false;show('已登出本次測試。');}catch(error){show('登出未確認成功，請重試。'+error.message);}});
</script></body></html>
